apiVersion: batch/v1
kind: Job
metadata:
  name: mcr-transformer-l40-finetune-medhard-20260528a
  namespace: nourish-sdsc
  labels:
    app: mcr-transformer
    task: finetune-medhard
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: mcr-transformer
        task: finetune-medhard
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: finetune-medhard
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command:
            - sh
            - -lc
            - |
              set -eux
              python -m pip install --no-cache-dir PyMahjongGB
              python - <<'PY'
              import torch
              import MahjongGB
              print("repo_commit", "finetune-medhard-20260528a")
              print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count())
              print("MahjongGB import ok")
              PY
              SPLIT=data/processed/chaga0208_all_plus_live_elo2300_cached_reviews/session_split_seed20260527
              BASE=models/transformer_candidate_allhighelo_chagaeval_med_l40_20260527d_plateau_e2b1000.pt
              test -s "${BASE}"
              python scripts/check_chaga_training_corpus.py \
                --train-raw ${SPLIT}/train.prepared.jsonl \
                --val-raw ${SPLIT}/val.prepared.jsonl \
                --test-raw ${SPLIT}/test.prepared.jsonl \
                --train-audit ${SPLIT}/train.audit.jsonl \
                --val-audit ${SPLIT}/val.audit.jsonl \
                --test-audit ${SPLIT}/test.audit.jsonl \
                --train-val-audit ${SPLIT}/train_val.audit.jsonl \
                --summary-out runs/transformer_candidate_finetune_medhard_l40_20260528a_corpus_gate.json \
                --max-candidates 235
              python scripts/summarize_chaga_coverage.py \
                --train-raw ${SPLIT}/train.prepared.jsonl \
                --val-raw ${SPLIT}/val.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/train_val.audit.jsonl \
                --summary-out runs/transformer_candidate_finetune_medhard_l40_20260528a_coverage.json \
                --no-rule-features
              python scripts/mine_chaga_hard_examples.py \
                --checkpoint ${BASE} \
                --raw ${SPLIT}/train.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/train_val.audit.jsonl \
                --out-jsonl runs/transformer_candidate_finetune_medhard_l40_20260528a_hard_examples.jsonl \
                --summary-out runs/transformer_candidate_finetune_medhard_l40_20260528a_hard_examples_summary.json \
                --max-candidates 235 \
                --batch-size 128 \
                --no-rule-features
              python scripts/train_transformer_candidate.py \
                --raw ${SPLIT}/train.prepared.jsonl \
                --eval-raw ${SPLIT}/val.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/train_val.audit.jsonl \
                --init-checkpoint ${BASE} \
                --hard-examples-jsonl runs/transformer_candidate_finetune_medhard_l40_20260528a_hard_examples.jsonl \
                --train-reviewed-only \
                --val-reviewed-only \
                --require-teacher-distribution \
                --max-candidates 235 \
                --hard-loss-weight 0.0 \
                --teacher-loss-weight 0.0 \
                --reviewed-hard-loss-weight 0.0 \
                --reviewed-teacher-loss-weight 0.05 \
                --reviewed-accept-set-loss-weight 1.0 \
                --unreviewed-hard-loss-weight 0.0 \
                --value-loss-weight 0.0 \
                --teacher-temperature 0.2 \
                --monitor-metric val_original_relaxed_accuracy \
                --epochs 2 \
                --batch-size 128 \
                --lr 0.00001 \
                --weight-decay 0.03 \
                --d-model 768 \
                --nhead 12 \
                --num-layers 12 \
                --dim-feedforward 3072 \
                --dropout 0.15 \
                --log-every-batches 50 \
                --eval-every-batches 100 \
                --out models/transformer_candidate_finetune_medhard_l40_20260528a.pt \
                --metrics-out runs/transformer_candidate_finetune_medhard_l40_20260528a_metrics.json
              python scripts/evaluate_transformer_chaga_review.py \
                --checkpoint models/transformer_candidate_finetune_medhard_l40_20260528a.pt \
                --raw ${SPLIT}/val.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/val.audit.jsonl \
                --max-candidates 235 \
                --batch-size 128 \
                --metrics-out runs/transformer_candidate_finetune_medhard_l40_20260528a_val_eval.json
              python - <<'PY'
              import json
              from pathlib import Path
              metrics = json.loads(Path("runs/transformer_candidate_finetune_medhard_l40_20260528a_val_eval.json").read_text())
              train = json.loads(Path("runs/transformer_candidate_finetune_medhard_l40_20260528a_metrics.json").read_text())
              hard = json.loads(Path("runs/transformer_candidate_finetune_medhard_l40_20260528a_hard_examples_summary.json").read_text())
              coverage = json.loads(Path("runs/transformer_candidate_finetune_medhard_l40_20260528a_coverage.json").read_text())
              gate = json.loads(Path("runs/transformer_candidate_finetune_medhard_l40_20260528a_corpus_gate.json").read_text())
              baseline_relaxed = 0.8504287075261988
              baseline_play_relaxed = 0.8539325842696629
              summary = {
                  "checkpoint": "models/transformer_candidate_finetune_medhard_l40_20260528a.pt",
                  "base_checkpoint": "models/transformer_candidate_allhighelo_chagaeval_med_l40_20260527d_plateau_e2b1000.pt",
                  "train_metrics": "runs/transformer_candidate_finetune_medhard_l40_20260528a_metrics.json",
                  "val_eval": "runs/transformer_candidate_finetune_medhard_l40_20260528a_val_eval.json",
                  "hard_examples": "runs/transformer_candidate_finetune_medhard_l40_20260528a_hard_examples.jsonl",
                  "hard_summary": hard,
                  "coverage_gates": coverage.get("gates"),
                  "corpus_gate": {
                      "train_reviewed": gate["splits"]["train"]["reviewed_examples"],
                      "val_reviewed": gate["splits"]["val"]["reviewed_examples"],
                      "test_reviewed": gate["splits"]["test"]["reviewed_examples"],
                      "train_candidate_truncation": gate["splits"]["train"]["gate_summary"]["candidate_truncation_count"],
                      "val_candidate_truncation": gate["splits"]["val"]["gate_summary"]["candidate_truncation_count"],
                      "test_candidate_truncation": gate["splits"]["test"]["gate_summary"]["candidate_truncation_count"],
                  },
                  "best_epoch": train.get("best_epoch"),
                  "init_checkpoint": train.get("init_checkpoint"),
                  "train_sampling": train.get("train_sampling"),
                  "reviewed_without_teacher_distribution": metrics.get("reviewed_without_teacher_distribution"),
                  "candidate_truncation_count": metrics.get("candidate_truncation_count"),
                  "evaluated_candidate_width": metrics.get("evaluated_candidate_width"),
                  "original_top1_accuracy": metrics.get("original_top1_accuracy"),
                  "original_top3_inclusion": metrics.get("original_top3_inclusion"),
                  "original_relaxed_accuracy": metrics.get("original_relaxed_accuracy"),
                  "original_play_relaxed_accuracy": metrics.get("original_play_relaxed_accuracy"),
                  "baseline_original_relaxed_accuracy": baseline_relaxed,
                  "baseline_original_play_relaxed_accuracy": baseline_play_relaxed,
              }
              summary["beats_baseline_relaxed_by_003"] = (summary["original_relaxed_accuracy"] or 0.0) >= baseline_relaxed + 0.003
              summary["play_relaxed_not_degraded_by_003"] = (summary["original_play_relaxed_accuracy"] or 0.0) >= baseline_play_relaxed - 0.003
              summary["passed_finetune_gate"] = (
                  summary["beats_baseline_relaxed_by_003"]
                  and summary["play_relaxed_not_degraded_by_003"]
                  and summary["reviewed_without_teacher_distribution"] == 0
                  and summary["candidate_truncation_count"] == 0
                  and summary["evaluated_candidate_width"] == 235
              )
              Path("runs/transformer_candidate_finetune_medhard_l40_20260528a_summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2))
              print(json.dumps(summary, ensure_ascii=False, indent=2))
              PY
          resources:
            requests:
              cpu: "4"
              memory: 48Gi
              ephemeral-storage: "0"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4800m"
              memory: 57Gi
              ephemeral-storage: 50Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
