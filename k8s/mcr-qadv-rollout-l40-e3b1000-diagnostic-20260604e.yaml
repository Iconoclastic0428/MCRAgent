apiVersion: batch/v1
kind: Job
metadata:
  name: mcr-qadv-rollout-l40-e3b1000-diagnostic-20260604e
  namespace: nourish-sdsc
  labels:
    app: mcr-transformer
    task: qadv-rollout-e3b1000-diagnostic
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: mcr-transformer
        task: qadv-rollout-e3b1000-diagnostic
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
        - key: nautilus.io/reservation
          operator: Equal
          value: csu-tide
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: qadv-rollout-e3b1000-diagnostic
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_qadv_20260529/repo
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: OMP_NUM_THREADS
              value: "8"
            - name: MKL_NUM_THREADS
              value: "8"
            - name: OPENBLAS_NUM_THREADS
              value: "8"
          command:
            - sh
            - -lc
            - |
              set -eux
              apt-get update
              apt-get install -y libboost-dev libjsoncpp-dev
              test -s build/official_judge/official_judge/main.cpp
              test -s build/official_judge/official_judge/mcr_fan_check.exe
              chmod +x build/official_judge/official_judge/mcr_fan_check.exe
              test -x build/official_judge/official_judge/mcr_fan_check.exe
              mkdir -p build/official_judge
              g++ -O2 -std=c++14 \
                -D_BOTZONE_ONLINE \
                build/official_judge/official_judge/main.cpp \
                -Ibuild/official_judge/official_judge \
                -I/usr/include/jsoncpp \
                -ljsoncpp \
                -o build/official_judge/mcr_judge.exe
              test -x build/official_judge/mcr_judge.exe
              python -m pip install --no-cache-dir PyMahjongGB
              python - <<'PY'
              import sys
              import torch
              import MahjongGB
              sys.path.insert(0, "scripts")
              from official_fan import OfficialFanChecker
              checker = OfficialFanChecker.default()
              assert checker is not None, "official fan checker missing"
              print("repo_commit", "qadv-rollout-e3b1000-diagnostic-20260604e")
              print("fan_checker", checker.exe_path)
              print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count())
              print("MahjongGB import ok")
              PY
              SPLIT=data/processed/chaga0208_all_plus_live_elo2400_cached_reviews/session_split_seed20260527
              BASE=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527/models/transformer_candidate_finetune_e3b1000_elo2400_5ep_l40_20260604a.pt
              QADV=models/qadv_reranker_e3b1000_v1_terminal_best.pt
              OUT=data/processed/qadv_e3b1000_20260604a
              RUNS=runs/qadv_e3b1000_20260604a/rollout_diagnostic_20260604e
              INITDATA=${OUT}/tziakcha_elo2400_val_reconstructed_initdata_64.jsonl
              test -s "${BASE}"
              test -s "${QADV}"
              test -s "${SPLIT}/val.prepared.jsonl"
              test -s scripts/convert_tziakcha_prepared_to_initdata.py
              test -s scripts/generate_qadv_league_rollouts.py
              mkdir -p "${OUT}" "${RUNS}"
              python scripts/convert_tziakcha_prepared_to_initdata.py \
                --prepared "${SPLIT}/val.prepared.jsonl" \
                --out-jsonl "${INITDATA}" \
                --summary-out "${RUNS}/tziakcha_reconstructed_initdata_summary.json" \
                --limit 64 \
                --min-written 64
              python scripts/generate_qadv_league_rollouts.py \
                --policy-spec "name=base,policy=transformer,model=${BASE}" \
                --policy-spec "name=qadv010,policy=transformer,model=${BASE},qadv_model=${QADV},qadv_lambda=0.10" \
                --raw "${INITDATA}" \
                --games 32 \
                --max-turns 500 \
                --gamma 0.995 \
                --out-jsonl "${RUNS}/qadv_vs_base_rollouts_tziakcha_val32.jsonl" \
                --summary-out "${RUNS}/qadv_vs_base_rollouts_tziakcha_val32_summary.json" \
                --min-games 32 \
                --min-rows 1 \
                --min-nonzero-score-rate 0.0 \
                --min-return-std 0.0 \
                --require-policy-pool-size 2
              python - <<'PY'
              import json
              from pathlib import Path

              summary_path = Path("runs/qadv_e3b1000_20260604a/rollout_diagnostic_20260604e/qadv_vs_base_rollouts_tziakcha_val32_summary.json")
              summary = json.loads(summary_path.read_text())
              status = {
                  "format": "mcr_qadv_rollout_diagnostic_v1",
                  "summary": str(summary_path),
                  "policy_diagnostics_totals": summary.get("policy_diagnostics_totals"),
                  "seat_policy_diagnostics_totals": summary.get("seat_policy_diagnostics_totals"),
                  "metrics_to_monitor": {
                      "policy_hu_rates": summary.get("policy_hu_rates"),
                      "policy_average_final_score_rewards_4_2_1_0": summary.get("policy_average_final_score_rewards_4_2_1_0"),
                      "policy_average_hu_turns": summary.get("policy_average_hu_turns"),
                      "illegal_hu_count": summary.get("illegal_hu_count"),
                      "terminal_action_counts": summary.get("terminal_action_counts"),
                  },
              }
              Path("runs/qadv_e3b1000_20260604a/rollout_diagnostic_20260604e/rollout_diagnostic_status.json").write_text(
                  json.dumps(status, ensure_ascii=False, indent=2)
              )
              print(json.dumps(status, ensure_ascii=False))
              PY
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 80Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 120Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
