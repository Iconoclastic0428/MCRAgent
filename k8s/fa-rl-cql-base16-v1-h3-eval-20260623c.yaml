apiVersion: batch/v1
kind: Job
metadata:
  name: fa-rl-cql-base16-v1-h3-eval-20260623c
  namespace: nourish-sdsc
  labels:
    app: feature-agent
    task: rl-cql-base16-h3-eval
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: feature-agent
        task: rl-cql-base16-h3-eval
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: eval
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          command: ["bash", "-lc"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: NUMEXPR_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 12Gi
            limits:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 12Gi
          volumeMounts:
            - name: eval-src
              mountPath: /opt/rl-eval-src
            - name: feature-agent-src
              mountPath: /opt/feature-agent-src
            - name: idl-data
              mountPath: /data/idl
          args:
            - |
              set -euxo pipefail
              DATA_ROOT=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
              RUN=rl_cql_base16_v1_h3_eval_20260623c
              WORK=/tmp/${RUN}
              RUN_DIR=${DATA_ROOT}/runs/${RUN}
              FEATURE_DIR=${WORK}/third_party/mahjong-agent-2025-aug12-excludespecial-3pkl/feature-agent
              JUDGE_DIR=${WORK}/build/official_judge
              JUDGE=${JUDGE_DIR}/mcr_judge
              RAW=${WORK}/data/eval/botzone_mcr_first64_suit_permuted_384.jsonl
              CANDIDATE=${DATA_ROOT}/models/rl_cql_base16_v1_20260623c/final.pkl
              CHAMPION=${DATA_ROOT}/models/feature_agent_checkpoints/feature_agent_botzone98209_aug12_river_elastic_2xgpu_20260617a/16.pkl
              OUT=${RUN_DIR}/summary.json
              mkdir -p "${WORK}/scripts" "${FEATURE_DIR}" "${WORK}/data/eval" "${RUN_DIR}" "${JUDGE_DIR}"
              exec > >(tee -a "${RUN_DIR}/eval.stdout.log") 2>&1
              cp /opt/rl-eval-src/*.py "${WORK}/scripts/"
              cp /opt/rl-eval-src/botzone_mcr_first64_suit_permuted_384.jsonl "${RAW}"
              cp /opt/feature-agent-src/*.py "${FEATURE_DIR}/"
              python -m pip install --no-cache-dir PyMahjongGB
              apt-get update
              apt-get install -y libboost-dev libjsoncpp-dev
              mkdir -p "${JUDGE_DIR}/MahjongGB" "${JUDGE_DIR}/jsoncpp"
              cp "${DATA_ROOT}/external/Chinese-Standard-Mahjong/judge/main.cpp" "${JUDGE_DIR}/main.cpp"
              cp "${DATA_ROOT}"/external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/*.cpp "${JUDGE_DIR}/MahjongGB/"
              cp "${DATA_ROOT}"/external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/*.h "${JUDGE_DIR}/MahjongGB/"
              cp /usr/include/jsoncpp/json/*.h "${JUDGE_DIR}/jsoncpp/"
              g++ -O2 -std=c++14 -D_BOTZONE_ONLINE "${JUDGE_DIR}/main.cpp" -I"${JUDGE_DIR}" -I/usr/include -ljsoncpp -o "${JUDGE}"
              test -x "${JUDGE}"
              test -s "${CANDIDATE}"
              test -s "${CHAMPION}"
              cd "${WORK}"
              python -m py_compile \
                scripts/rl_evaluate_mcr.py \
                scripts/rl_collect_mcr.py \
                scripts/benchmark_json_policies.py \
                scripts/feature_repo_json_runtime.py \
                third_party/mahjong-agent-2025-aug12-excludespecial-3pkl/feature-agent/feature.py \
                third_party/mahjong-agent-2025-aug12-excludespecial-3pkl/feature-agent/model.py \
                third_party/mahjong-agent-2025-aug12-excludespecial-3pkl/feature-agent/rl_model_utils.py
              python "${WORK}/scripts/rl_evaluate_mcr.py" \
                --candidate-checkpoint "${CANDIDATE}" \
                --champion-checkpoint "${CHAMPION}" \
                --raw "${RAW}" \
                --judge "${JUDGE}" \
                --games-per-seat 512 \
                --legal-dueling-mean \
                --out "${OUT}" \
                2>&1 | tee -a "${RUN_DIR}/eval.progress.log"
      volumes:
        - name: eval-src
          configMap:
            name: mcr-rl-eval-src-20260623a
        - name: feature-agent-src
          configMap:
            name: mcr-rl-feature-agent-src-20260623b
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
