apiVersion: batch/v1
kind: Job
metadata:
  name: fa-ijcai-fpn-vw-noaug-pack-lr5e4-wd0-2g-20260619a
  namespace: nourish-sdsc
  labels:
    app: feature-agent
    task: ijcai-fpn-validwidth-noaug-pack-lr5e4-wd0
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 604800
  template:
    metadata:
      labels:
        app: feature-agent
        task: ijcai-fpn-validwidth-noaug-pack-lr5e4-wd0
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40S
                      - NVIDIA-L40
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-RTX-A6000
                      - NVIDIA-RTX-A5000
                      - NVIDIA-A40
                      - NVIDIA-A10
                      - NVIDIA-L4
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                      - Tesla-V100-SXM2-32GB
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: feature-agent-train
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              DATA_ROOT=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
              VEC_RUN=feature_agent_ijcai_direct_vec_20260616a
              RUN=feature_agent_ijcai_direct_slide_fpn_validwidth_noaug_packed_bs1024_lr5e4_wd0_2gpu_20260619a
              WORK=/tmp/${RUN}
              SRC=/opt/feature-agent-src
              VEC_DIR="${DATA_ROOT}/data/processed/${VEC_RUN}/data-vec"
              TRANSCRIPT="${DATA_ROOT}/data/processed/${VEC_RUN}/data.txt"
              PACKED_CACHE="${DATA_ROOT}/data/processed/${VEC_RUN}/packed_noaug_90_10"
              export RUN VEC_RUN VEC_DIR TRANSCRIPT PACKED_CACHE
              test -s "${VEC_DIR}/DONE"
              test -s "${VEC_DIR}/count.json"
              test -s "${VEC_DIR}/0.npz"
              test -s "${TRANSCRIPT}"
              mkdir -p "${WORK}/feature-agent" "${DATA_ROOT}/runs/${RUN}" "${DATA_ROOT}/models/${RUN}" "${PACKED_CACHE}"
              cp "${SRC}"/*.py "${WORK}/feature-agent/"
              cd "${WORK}/feature-agent"
              python -m pip install --no-cache-dir PyMahjongGB
              python -m py_compile agent.py audit_data_vec.py botzone_jsonl_to_feature_txt.py dataset.py feature.py model.py parallel.py preprocess.py supervised.py
              python - <<'PY'
              import json
              import os
              import re
              from pathlib import Path

              import numpy as np
              import torch
              from model import SlideFPNModel

              vec_dir = Path(os.environ["VEC_DIR"])
              transcript = Path(os.environ["TRANSCRIPT"])
              counts = json.loads((vec_dir / "count.json").read_text())
              first_match = next(i for i, count in enumerate(counts) if count > 0)
              with np.load(vec_dir / f"{first_match}.npz") as d:
                  obs = d["obs"]
                  mask = d["mask"]
                  assert obs.shape[1:] == (85, 4, 9), obs.shape
                  assert mask.shape[1] == 235, mask.shape
                  obs_batch = torch.from_numpy(np.array(obs[:2, :60])).float()
                  mask_batch = torch.from_numpy(np.array(mask[:2])).float()
              ignore_re = re.compile(r"Ignore Player ([0-3]) ([A-Za-z]+) ([A-Z][0-9])", re.I)
              ignore_tokens = 0
              with transcript.open(encoding="utf-8") as f:
                  for line in f:
                      ignore_tokens += len(ignore_re.findall(line))
              assert len(counts) == 98209, len(counts)
              assert sum(counts) == 5865816, sum(counts)
              assert ignore_tokens == 13646, ignore_tokens
              assert torch.cuda.is_available()
              assert torch.cuda.device_count() >= 2, torch.cuda.device_count()
              model = SlideFPNModel(
                  obs_dim=60,
                  vec_dim=117,
                  hidden=128,
                  num_fpn_blocks=1,
                  fc_hidden=0,
                  use_vec=False,
                  stem_mode="valid_width",
              )
              logits = model({
                  "is_training": False,
                  "obs": {
                      "observation": obs_batch,
                      "action_mask": mask_batch,
                  },
              })
              assert tuple(logits.shape) == (2, 235), logits.shape
              assert model.spatial_h == 4 and model.spatial_w == 7, (model.spatial_h, model.spatial_w)
              print(json.dumps({
                  "run": os.environ["RUN"],
                  "vec_run": os.environ["VEC_RUN"],
                  "data_vec": str(vec_dir),
                  "transcript": str(transcript),
                  "packed_cache": os.environ["PACKED_CACHE"],
                  "matches": len(counts),
                  "base_samples": int(sum(counts)),
                  "ignore_tokens": ignore_tokens,
                  "model_kind": "slide-fpn",
                  "slide_fpn_obs_planes": 60,
                  "slide_fpn_blocks": 1,
                  "slide_fpn_stem_mode": "valid_width",
                  "slide_fpn_spatial": [4, 7],
                  "slide_fpn_use_vec": False,
                  "fc_hidden": 0,
                  "batch_size": 1024,
                  "lr": 0.0005,
                  "weight_decay": 0.0,
                  "epochs": 16,
                  "data_parallel": True,
                  "augment": False,
                  "augment_mode_cli": "none",
                  "parameter_count": sum(p.numel() for p in model.parameters()),
                  "memory_request_gib": 48,
                  "measured_prior_memory_gib": 20.7,
                  "torch": torch.__version__,
                  "cuda": torch.cuda.is_available(),
                  "device_count": torch.cuda.device_count(),
              }, sort_keys=True), flush=True)
              PY
              python supervised.py \
                --data-folder "${VEC_DIR}" \
                --version "${RUN}" \
                --log-root "${DATA_ROOT}/models/feature_agent_checkpoints" \
                --runs-root "${DATA_ROOT}/runs/feature_agent_tensorboard" \
                --epochs 16 \
                --batch-size 1024 \
                --lr 0.0005 \
                --weight-decay 0.0 \
                --split-ratio 0.9 \
                --split-mode contiguous \
                --device cuda \
                --data-parallel \
                --num-workers 0 \
                --pin-memory \
                --nonblocking-transfer \
                --no-augment \
                --augment-mode none \
                --model-kind slide-fpn \
                --hidden 128 \
                --slide-fpn-obs-planes 60 \
                --slide-fpn-blocks 1 \
                --slide-fpn-stem-mode valid_width \
                --fc-hidden 0 \
                --packed-cache-dir "${PACKED_CACHE}"
              cp "${DATA_ROOT}/models/feature_agent_checkpoints/${RUN}/final.pkl" "${DATA_ROOT}/models/${RUN}/final.pkl"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
          resources:
            requests:
              cpu: "12"
              memory: 48Gi
              ephemeral-storage: 20Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "14"
              memory: 57Gi
              ephemeral-storage: 80Gi
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: feature-agent-src
              mountPath: /opt/feature-agent-src
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: feature-agent-src
          configMap:
            name: feature-agent-src-slide-fpn-validwidth-wd0-20260619a
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
