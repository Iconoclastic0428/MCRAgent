apiVersion: batch/v1
kind: Job
metadata:
  name: mcr-qadv-l40-v0-20260529a
  namespace: nourish-sdsc
  labels:
    app: mcr-transformer
    task: qadv-v0
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: mcr-transformer
        task: qadv-v0
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
        - key: nautilus.io/reservation
          operator: Equal
          value: csu-tide
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: qadv-v0
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_qadv_20260529/repo
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command:
            - sh
            - -lc
            - |
              set -eux
              python -m pip install --no-cache-dir PyMahjongGB
              python - <<'PY'
              import torch
              import MahjongGB
              print("repo_commit", "qadv-v0-20260529a")
              print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count())
              print("MahjongGB import ok")
              PY
              SPLIT=data/processed/chaga0208_all_plus_live_elo2400_cached_reviews/session_split_seed20260527
              BASE=models/transformer_candidate_finetune_medhard_l40_20260528b.pt
              TRAIN_HARD=data/processed/qadv/qadv_hard_train_v0.jsonl
              VAL_HARD=data/processed/qadv/qadv_hard_val_v0.jsonl
              test -s "${BASE}"
              mkdir -p data/processed/qadv runs/qadv models
              python scripts/mine_chaga_hard_examples.py \
                --checkpoint ${BASE} \
                --raw ${SPLIT}/train.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/train_val.audit.jsonl \
                --out-jsonl ${TRAIN_HARD} \
                --summary-out data/processed/qadv/qadv_hard_train_v0_summary.json \
                --batch-size 256 \
                --max-candidates 235 \
                --relaxed-play-top3-count 4 \
                --output-format qadv \
                --fail-on-gate \
                --device cuda
              python scripts/mine_chaga_hard_examples.py \
                --checkpoint ${BASE} \
                --raw ${SPLIT}/val.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/train_val.audit.jsonl \
                --out-jsonl ${VAL_HARD} \
                --summary-out data/processed/qadv/qadv_hard_val_v0_summary.json \
                --batch-size 256 \
                --max-candidates 235 \
                --relaxed-play-top3-count 4 \
                --output-format qadv \
                --fail-on-gate \
                --device cuda
              python - <<'PY'
              import json
              from pathlib import Path
              required_zero = [
                  "empty_accepted_sets",
                  "empty_hard_negative_sets_for_mismatches",
                  "low_fan_hu",
                  "action_outside_mask",
                  "candidate_truncation_count",
              ]
              summaries = {
                  "train": json.loads(Path("data/processed/qadv/qadv_hard_train_v0_summary.json").read_text()),
                  "val": json.loads(Path("data/processed/qadv/qadv_hard_val_v0_summary.json").read_text()),
              }
              for split, summary in summaries.items():
                  if int(summary.get("rows") or 0) <= 0:
                      raise SystemExit(f"{split} qadv rows must be nonzero")
                  if int(summary.get("hard_rows") or 0) <= 0:
                      raise SystemExit(f"{split} qadv hard rows must be nonzero")
                  failures = {key: summary.get(key) for key in required_zero if int(summary.get(key) or 0) != 0}
                  if failures:
                      raise SystemExit(f"{split} qadv gate failed: {failures}")
              print(json.dumps({"event": "qadv_mining_gate_passed", "summaries": summaries}, ensure_ascii=False))
              PY
              python scripts/train_qadv_reranker.py \
                --hard-jsonl ${TRAIN_HARD} \
                --eval-hard-jsonl ${VAL_HARD} \
                --model-out models/qadv_reranker_v0_final.pt \
                --best-model-out models/qadv_reranker_v0_best.pt \
                --metrics-out runs/qadv/qadv_reranker_v0_train_metrics.json \
                --epochs 3 \
                --batch-size 1024 \
                --hidden-size 512 \
                --num-layers 4 \
                --dropout 0.05 \
                --lr 0.0003 \
                --weight-decay 0.01 \
                --grad-clip 1.0 \
                --weighted-sampler \
                --train-lambda 0.20 \
                --eval-lambda 0.10 \
                --margin 0.5 \
                --accept-weight 1.0 \
                --pair-weight 0.5 \
                --cql-weight 0.03 \
                --soft-weight 0.05 \
                --q-l2-weight 0.0001 \
                --device cuda
              python scripts/evaluate_qadv_reranker.py \
                --hard-jsonl ${VAL_HARD} \
                --q-checkpoint models/qadv_reranker_v0_best.pt \
                --metrics-out runs/qadv/qadv_reranker_v0_val_lambda_sweep.json \
                --batch-size 1024 \
                --lambdas 0.00,0.05,0.10,0.20,0.35,0.50 \
                --device cuda
              python - <<'PY'
              import json
              from pathlib import Path
              sweep = json.loads(Path("runs/qadv/qadv_reranker_v0_val_lambda_sweep.json").read_text())
              train = json.loads(Path("runs/qadv/qadv_reranker_v0_train_metrics.json").read_text())
              lambda_zero = sweep["lambda_metrics"]["0.00"]
              if int(lambda_zero.get("lambda_zero_reproduction_mismatches") or 0) != 0:
                  raise SystemExit("lambda zero must reproduce frozen baseline exactly")
              if int(lambda_zero.get("low_fan_hu_count") or 0) != 0:
                  raise SystemExit("lambda zero low-fan Hu count must be zero")
              if int(lambda_zero.get("action_outside_mask") or 0) != 0:
                  raise SystemExit("lambda zero action-outside-mask count must be zero")
              baseline_relaxed = float(lambda_zero.get("original_relaxed_accuracy") or 0.0)
              baseline_play = float(lambda_zero.get("original_play_relaxed_accuracy") or 0.0)
              candidates = []
              for lam, metrics in sweep["lambda_metrics"].items():
                  relaxed = float(metrics.get("original_relaxed_accuracy") or 0.0)
                  play = float(metrics.get("original_play_relaxed_accuracy") or 0.0)
                  changed_good = float(metrics.get("changed_to_accepted_rate") or 0.0)
                  changed_bad = float(metrics.get("changed_from_accepted_to_wrong_rate") or 0.0)
                  safe = (
                      int(metrics.get("low_fan_hu_count") or 0) == 0
                      and int(metrics.get("action_outside_mask") or 0) == 0
                      and relaxed >= baseline_relaxed - 0.003
                      and play >= baseline_play - 0.003
                      and changed_good > changed_bad
                  )
                  promising = safe and (relaxed > baseline_relaxed or changed_good - changed_bad >= 0.005)
                  candidates.append({
                      "lambda": lam,
                      "safe": safe,
                      "promising": promising,
                      "relaxed": relaxed,
                      "play_relaxed": play,
                      "changed_to_accepted_rate": changed_good,
                      "changed_from_accepted_to_wrong_rate": changed_bad,
                  })
              summary = {
                  "format": "mcr_qadv_v0_k8s_summary",
                  "base_checkpoint": "models/transformer_candidate_finetune_medhard_l40_20260528b.pt",
                  "train_hard": "data/processed/qadv/qadv_hard_train_v0.jsonl",
                  "val_hard": "data/processed/qadv/qadv_hard_val_v0.jsonl",
                  "train_metrics": "runs/qadv/qadv_reranker_v0_train_metrics.json",
                  "lambda_sweep": "runs/qadv/qadv_reranker_v0_val_lambda_sweep.json",
                  "best_model": "models/qadv_reranker_v0_best.pt",
                  "best_epoch": train.get("best_epoch"),
                  "best_metric": train.get("best_metric"),
                  "best_tiebreak": train.get("best_tiebreak"),
                  "lambda_zero": lambda_zero,
                  "candidate_lambdas": candidates,
                  "promising_lambdas": [item for item in candidates if item["promising"]],
              }
              Path("runs/qadv/qadv_reranker_v0_summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2))
              print(json.dumps(summary, ensure_ascii=False))
              PY
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: "0"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 50Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
