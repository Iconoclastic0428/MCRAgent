apiVersion: batch/v1
kind: Job
metadata:
  name: mcr-transformer-l40-ft-e3b1000-2400-5ep-20260604a
  namespace: nourish-sdsc
  labels:
    app: mcr-transformer
    task: ft-e3b1000-2400-5ep
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 259200
  template:
    metadata:
      labels:
        app: mcr-transformer
        task: ft-e3b1000-2400-5ep
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
        - key: nautilus.io/reservation
          operator: Equal
          value: csu-tide
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: ft-e3b1000-2400-5ep
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command:
            - sh
            - -lc
            - |
              set -eux
              python -m pip install --no-cache-dir PyMahjongGB
              python - <<'PY'
              import torch
              import MahjongGB
              print("repo_commit", "ft-e3b1000-2400-5ep-20260604a")
              print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count())
              print("MahjongGB import ok")
              PY

              SPLIT=data/processed/chaga0208_all_plus_live_elo2400_cached_reviews/session_split_seed20260527
              BASE=models/transformer_candidate_allhighelo_medbase_continue5ep_e3b1000_l40_20260604.pt
              BASE_SHA256=7d5a6b3e31382480051c6d2a43ab00f055fb71f40b4e78e01209daeb6270d9fe
              RUN_PREFIX=transformer_candidate_finetune_e3b1000_elo2400_5ep_l40_20260604a
              OUT=models/${RUN_PREFIX}.pt

              test -s "${BASE}"
              test -s "${SPLIT}/train.prepared.jsonl"
              test -s "${SPLIT}/val.prepared.jsonl"
              test -s "${SPLIT}/test.prepared.jsonl"
              test -s "${SPLIT}/train_val.audit.jsonl"

              python - <<'PY'
              import hashlib
              import json
              import torch
              from pathlib import Path

              base = Path("models/transformer_candidate_allhighelo_medbase_continue5ep_e3b1000_l40_20260604.pt")
              expected_sha = "7d5a6b3e31382480051c6d2a43ab00f055fb71f40b4e78e01209daeb6270d9fe"
              actual_sha = hashlib.sha256(base.read_bytes()).hexdigest()
              checkpoint = torch.load(base, map_location="cpu")
              best = ((checkpoint.get("selection") or {}).get("best_epoch") or {})
              gate = {
                  "base": str(base),
                  "sha256": actual_sha,
                  "selection_epoch": best.get("epoch"),
                  "selection_phase": best.get("phase"),
                  "selection_batch": best.get("batch"),
                  "selection_relaxed": best.get("val_original_relaxed_accuracy"),
                  "selection_play_relaxed": best.get("val_original_play_relaxed_accuracy"),
                  "selection_top1": best.get("val_original_top1_accuracy"),
              }
              print(json.dumps(gate, indent=2))
              if actual_sha != expected_sha:
                  raise SystemExit(f"base checkpoint sha mismatch: {actual_sha} != {expected_sha}")
              if best.get("epoch") != 3 or best.get("phase") != "batch_snapshot" or best.get("batch") != 1000:
                  raise SystemExit(f"base checkpoint is not E3 B1000: {best}")
              PY

              python scripts/check_chaga_training_corpus.py \
                --train-raw ${SPLIT}/train.prepared.jsonl \
                --val-raw ${SPLIT}/val.prepared.jsonl \
                --test-raw ${SPLIT}/test.prepared.jsonl \
                --train-audit ${SPLIT}/train.audit.jsonl \
                --val-audit ${SPLIT}/val.audit.jsonl \
                --test-audit ${SPLIT}/test.audit.jsonl \
                --train-val-audit ${SPLIT}/train_val.audit.jsonl \
                --summary-out runs/${RUN_PREFIX}_corpus_gate.json \
                --max-candidates 235

              python scripts/summarize_chaga_coverage.py \
                --train-raw ${SPLIT}/train.prepared.jsonl \
                --val-raw ${SPLIT}/val.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/train_val.audit.jsonl \
                --summary-out runs/${RUN_PREFIX}_coverage.json \
                --no-rule-features

              python scripts/evaluate_transformer_chaga_review.py \
                --checkpoint ${BASE} \
                --raw ${SPLIT}/val.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/val.audit.jsonl \
                --max-candidates 235 \
                --batch-size 128 \
                --no-rule-features \
                --metrics-out runs/${RUN_PREFIX}_base_val_eval.json

              python scripts/mine_chaga_hard_examples.py \
                --checkpoint ${BASE} \
                --raw ${SPLIT}/train.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/train_val.audit.jsonl \
                --out-jsonl runs/${RUN_PREFIX}_hard_examples.jsonl \
                --summary-out runs/${RUN_PREFIX}_hard_examples_summary.json \
                --max-candidates 235 \
                --batch-size 128 \
                --no-rule-features

              python scripts/train_transformer_candidate.py \
                --raw ${SPLIT}/train.prepared.jsonl \
                --eval-raw ${SPLIT}/val.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/train_val.audit.jsonl \
                --init-checkpoint ${BASE} \
                --hard-examples-jsonl runs/${RUN_PREFIX}_hard_examples.jsonl \
                --train-reviewed-only \
                --val-reviewed-only \
                --require-teacher-distribution \
                --max-candidates 235 \
                --no-rule-features \
                --hard-loss-weight 0.0 \
                --teacher-loss-weight 0.0 \
                --reviewed-hard-loss-weight 0.0 \
                --reviewed-teacher-loss-weight 0.05 \
                --reviewed-accept-set-loss-weight 1.0 \
                --unreviewed-hard-loss-weight 0.0 \
                --value-loss-weight 0.0 \
                --teacher-temperature 0.2 \
                --monitor-metric val_original_relaxed_accuracy \
                --epochs 5 \
                --batch-size 128 \
                --lr 0.00001 \
                --weight-decay 0.03 \
                --d-model 768 \
                --nhead 12 \
                --num-layers 12 \
                --dim-feedforward 3072 \
                --dropout 0.15 \
                --log-every-batches 50 \
                --eval-every-batches 100 \
                --out ${OUT} \
                --metrics-out runs/${RUN_PREFIX}_metrics.json

              python scripts/evaluate_transformer_chaga_review.py \
                --checkpoint ${OUT} \
                --raw ${SPLIT}/val.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/val.audit.jsonl \
                --max-candidates 235 \
                --batch-size 128 \
                --no-rule-features \
                --metrics-out runs/${RUN_PREFIX}_val_eval.json

              python scripts/evaluate_transformer_chaga_review.py \
                --checkpoint ${OUT} \
                --raw ${SPLIT}/test.prepared.jsonl \
                --review-audit-jsonl ${SPLIT}/test.audit.jsonl \
                --max-candidates 235 \
                --batch-size 128 \
                --no-rule-features \
                --metrics-out runs/${RUN_PREFIX}_test_eval.json

              python - <<'PY'
              import json
              from pathlib import Path

              run_prefix = "transformer_candidate_finetune_e3b1000_elo2400_5ep_l40_20260604a"
              metrics = json.loads(Path(f"runs/{run_prefix}_metrics.json").read_text())
              base_metrics = json.loads(Path(f"runs/{run_prefix}_base_val_eval.json").read_text())
              val_metrics = json.loads(Path(f"runs/{run_prefix}_val_eval.json").read_text())
              test_metrics = json.loads(Path(f"runs/{run_prefix}_test_eval.json").read_text())
              hard = json.loads(Path(f"runs/{run_prefix}_hard_examples_summary.json").read_text())
              coverage = json.loads(Path(f"runs/{run_prefix}_coverage.json").read_text())
              gate = json.loads(Path(f"runs/{run_prefix}_corpus_gate.json").read_text())

              per_epoch = {}
              for row in metrics.get("history") or []:
                  epoch = int(row.get("epoch") or 0)
                  score = row.get("val_original_relaxed_accuracy")
                  if not epoch or score is None:
                      continue
                  incumbent = per_epoch.get(epoch)
                  if incumbent is None or float(score) > float(incumbent.get("val_original_relaxed_accuracy") or -1):
                      per_epoch[epoch] = row

              per_epoch_best = []
              for epoch in sorted(per_epoch):
                  row = per_epoch[epoch]
                  per_epoch_best.append({
                      "epoch": epoch,
                      "phase": row.get("phase"),
                      "batch": row.get("batch"),
                      "val_original_relaxed_accuracy": row.get("val_original_relaxed_accuracy"),
                      "val_original_play_relaxed_accuracy": row.get("val_original_play_relaxed_accuracy"),
                      "val_original_top1_accuracy": row.get("val_original_top1_accuracy"),
                      "val_loss": row.get("val_loss"),
                  })

              baseline_relaxed = float(base_metrics.get("original_relaxed_accuracy") or 0.0)
              baseline_play_relaxed = float(base_metrics.get("original_play_relaxed_accuracy") or 0.0)
              summary = {
                  "format": "mcr_transformer_finetune_e3b1000_elo2400_5ep_summary_v1",
                  "checkpoint": f"models/{run_prefix}.pt",
                  "base_checkpoint": "models/transformer_candidate_allhighelo_medbase_continue5ep_e3b1000_l40_20260604.pt",
                  "base_sha256": "7d5a6b3e31382480051c6d2a43ab00f055fb71f40b4e78e01209daeb6270d9fe",
                  "train_split": "data/processed/chaga0208_all_plus_live_elo2400_cached_reviews/session_split_seed20260527",
                  "train_mode": "strict_reviewed_only_elo2400_accept_set_finetune",
                  "compute_rule_features": metrics.get("compute_rule_features"),
                  "active_deadline_seconds": 259200,
                  "train_metrics": f"runs/{run_prefix}_metrics.json",
                  "base_val_eval": f"runs/{run_prefix}_base_val_eval.json",
                  "val_eval": f"runs/{run_prefix}_val_eval.json",
                  "test_eval": f"runs/{run_prefix}_test_eval.json",
                  "hard_summary": hard,
                  "coverage_gates": coverage.get("gates"),
                  "corpus_gate": {
                      "train_reviewed": gate["splits"]["train"]["reviewed_examples"],
                      "val_reviewed": gate["splits"]["val"]["reviewed_examples"],
                      "test_reviewed": gate["splits"]["test"]["reviewed_examples"],
                      "train_candidate_truncation": gate["splits"]["train"]["gate_summary"]["candidate_truncation_count"],
                      "val_candidate_truncation": gate["splits"]["val"]["gate_summary"]["candidate_truncation_count"],
                      "test_candidate_truncation": gate["splits"]["test"]["gate_summary"]["candidate_truncation_count"],
                  },
                  "monitor_metric": metrics.get("monitor_metric"),
                  "global_best": metrics.get("best_epoch"),
                  "per_epoch_best": per_epoch_best,
                  "baseline_original_top1_accuracy": base_metrics.get("original_top1_accuracy"),
                  "baseline_original_relaxed_accuracy": baseline_relaxed,
                  "baseline_original_play_relaxed_accuracy": baseline_play_relaxed,
                  "val_original_top1_accuracy": val_metrics.get("original_top1_accuracy"),
                  "val_original_relaxed_accuracy": val_metrics.get("original_relaxed_accuracy"),
                  "val_original_play_relaxed_accuracy": val_metrics.get("original_play_relaxed_accuracy"),
                  "test_original_top1_accuracy": test_metrics.get("original_top1_accuracy"),
                  "test_original_relaxed_accuracy": test_metrics.get("original_relaxed_accuracy"),
                  "test_original_play_relaxed_accuracy": test_metrics.get("original_play_relaxed_accuracy"),
                  "reviewed_without_teacher_distribution": val_metrics.get("reviewed_without_teacher_distribution"),
                  "candidate_truncation_count": val_metrics.get("candidate_truncation_count"),
                  "evaluated_candidate_width": val_metrics.get("evaluated_candidate_width"),
              }
              summary["val_top1_delta_vs_base"] = (
                  (summary["val_original_top1_accuracy"] or 0.0)
                  - (summary["baseline_original_top1_accuracy"] or 0.0)
              )
              summary["val_relaxed_delta_vs_base"] = (
                  (summary["val_original_relaxed_accuracy"] or 0.0) - baseline_relaxed
              )
              summary["val_play_relaxed_delta_vs_base"] = (
                  (summary["val_original_play_relaxed_accuracy"] or 0.0) - baseline_play_relaxed
              )
              summary["passed_finetune_gate"] = (
                  summary["candidate_truncation_count"] == 0
                  and summary["reviewed_without_teacher_distribution"] == 0
                  and summary["evaluated_candidate_width"] == 235
                  and (summary["val_original_relaxed_accuracy"] or 0.0) >= baseline_relaxed
                  and (summary["val_original_play_relaxed_accuracy"] or 0.0) >= baseline_play_relaxed - 0.003
              )
              Path(f"runs/{run_prefix}_summary.json").write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2)
              )
              print(json.dumps(summary, ensure_ascii=False, indent=2))
              PY
          resources:
            requests:
              cpu: "2"
              memory: 48Gi
              ephemeral-storage: "0"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2400m"
              memory: 57Gi
              ephemeral-storage: 50Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
