apiVersion: batch/v1
kind: Job
metadata:
  name: fa-rl-base16-play-1536-20260623a
  namespace: nourish-sdsc
  labels:
    app: feature-agent
    task: rl-base16-play-collection
spec:
  completionMode: Indexed
  completions: 16
  parallelism: 8
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: feature-agent
        task: rl-base16-play-collection
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: collect
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          command: ["bash", "-lc"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: NUMEXPR_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 12Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 12Gi
          volumeMounts:
            - name: play-src
              mountPath: /opt/rl-src
            - name: feature-agent-src
              mountPath: /opt/feature-agent-src
            - name: idl-data
              mountPath: /data/idl
          args:
            - |
              set -euxo pipefail
              DATA_ROOT=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
              RUN=rl_base16_offline_play_1536_20260623a
              SHARD=${JOB_COMPLETION_INDEX:-0}
              SEAT=$((SHARD % 4))
              PART=$((SHARD / 4))
              GAMES_PER_SLICE=96
              OFFSET=$((PART * GAMES_PER_SLICE))
              WORK=/tmp/${RUN}_shard_${SHARD}
              RUN_DIR=${DATA_ROOT}/runs/${RUN}
              OUT_DIR=${RUN_DIR}/shards/shard_${SHARD}
              JUDGE_DIR=${WORK}/official_judge
              JUDGE=${JUDGE_DIR}/mcr_judge
              FEATURE_DIR=${WORK}/third_party/mahjong-agent-2025-aug12-excludespecial-3pkl/feature-agent
              RAW=${WORK}/data/eval/botzone_mcr_first64_suit_permuted_384.jsonl
              CKPT=${DATA_ROOT}/models/feature_agent_checkpoints/feature_agent_botzone98209_aug12_river_elastic_2xgpu_20260617a/16.pkl
              mkdir -p "${WORK}/scripts" "${FEATURE_DIR}" "${WORK}/data/eval" "${OUT_DIR}" "${JUDGE_DIR}"
              cp /opt/rl-src/*.py "${WORK}/scripts/"
              cp /opt/rl-src/botzone_mcr_first64_suit_permuted_384.jsonl "${RAW}"
              cp /opt/feature-agent-src/*.py "${FEATURE_DIR}/"
              python -m pip install --no-cache-dir PyMahjongGB
              apt-get update
              apt-get install -y libboost-dev libjsoncpp-dev
              mkdir -p "${JUDGE_DIR}/MahjongGB" "${JUDGE_DIR}/jsoncpp"
              cp "${DATA_ROOT}/external/Chinese-Standard-Mahjong/judge/main.cpp" "${JUDGE_DIR}/main.cpp"
              cp "${DATA_ROOT}"/external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/*.cpp "${JUDGE_DIR}/MahjongGB/"
              cp "${DATA_ROOT}"/external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/*.h "${JUDGE_DIR}/MahjongGB/"
              cp /usr/include/jsoncpp/json/*.h "${JUDGE_DIR}/jsoncpp/"
              g++ -O2 -std=c++14 -D_BOTZONE_ONLINE "${JUDGE_DIR}/main.cpp" -I"${JUDGE_DIR}" -I/usr/include -ljsoncpp -o "${JUDGE}"
              test -x "${JUDGE}"
              test -s "${CKPT}"
              cd "${WORK}"
              python "${WORK}/scripts/rl_collect_mcr.py" \
                --checkpoint "${CKPT}" \
                --baseline-checkpoint "${CKPT}" \
                --raw "${RAW}" \
                --judge "${JUDGE}" \
                --games-per-seat "${GAMES_PER_SLICE}" \
                --initdata-offset "${OFFSET}" \
                --seats "${SEAT}" \
                --out "${OUT_DIR}" \
                --reward-scale 64 \
                --reward-clip 4 \
                --epsilon 0.0 \
                --temperature 0.05 \
                --shard-size 8192 \
                2>&1 | tee "${OUT_DIR}/collect.stdout.log"
      volumes:
        - name: play-src
          configMap:
            name: mcr-rl-play-src-20260623a
        - name: feature-agent-src
          configMap:
            name: mcr-rl-feature-agent-src-20260623a
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
