apiVersion: batch/v1
kind: Job
metadata:
  name: mcr-qadv-rollout-l40-e3b1000-20260605d
  namespace: nourish-sdsc
  labels:
    app: mcr-transformer
    task: qadv-rollout-e3b1000-featureseat200
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: mcr-transformer
        task: qadv-rollout-e3b1000-featureseat200
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
        - key: nautilus.io/reservation
          operator: Equal
          value: csu-tide
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: qadv-rollout-e3b1000
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_qadv_20260529/repo
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: OMP_NUM_THREADS
              value: "8"
            - name: MKL_NUM_THREADS
              value: "8"
            - name: OPENBLAS_NUM_THREADS
              value: "8"
          command:
            - sh
            - -lc
            - |
              set -eux
              apt-get update
              apt-get install -y libboost-dev libjsoncpp-dev
              test -s build/official_judge/official_judge/main.cpp
              test -s scripts/mcr_fan_check.cpp
              test -s build/official_judge/official_judge/MahjongGB/shanten.cpp
              test -s scripts/feature_transformer_policy.py
              python -m py_compile \
                advisor_service/transformer_predictor.py \
                scripts/feature_transformer_policy.py \
                scripts/official_judge_match.py \
                scripts/generate_qadv_league_rollouts.py \
                scripts/generate_random_mcr_initdata.py
              mkdir -p build/official_judge
              g++ -O2 -std=c++14 \
                -D_BOTZONE_ONLINE \
                build/official_judge/official_judge/main.cpp \
                -Ibuild/official_judge/official_judge \
                -I/usr/include/jsoncpp \
                -ljsoncpp \
                -o build/official_judge/mcr_judge.exe
              g++ -O2 -std=c++14 \
                scripts/mcr_fan_check.cpp \
                build/official_judge/official_judge/MahjongGB/shanten.cpp \
                -Ibuild/official_judge/official_judge \
                -I/usr/include/jsoncpp \
                -ljsoncpp \
                -o build/official_judge/mcr_fan_check.exe
              test -x build/official_judge/mcr_judge.exe
              test -x build/official_judge/mcr_fan_check.exe
              python -m pip install --no-cache-dir PyMahjongGB
              python - <<'PY'
              import sys
              import torch
              import MahjongGB
              sys.path.insert(0, "scripts")
              from official_fan import OfficialFanChecker
              from official_judge_match import make_policy
              checker = OfficialFanChecker.default()
              assert checker is not None, "official fan checker missing"
              assert str(checker.exe_path) == "build/official_judge/mcr_fan_check.exe", checker.exe_path
              smoke = checker.evaluate(
                  packs=[],
                  hand="W1 W1 W1 W2 W2 W2 W3 W3 W3 W4 W4 W4 W5".split(),
                  win_tile="W5",
                  flower_count=0,
                  is_self_draw=False,
                  is_4th_tile=False,
                  is_about_kong=False,
                  is_last=False,
                  seat_wind=0,
                  prevalent_wind=0,
                  player=0,
              )
              assert smoke["can_hu"], smoke
              print("repo_commit", "qadv-rollout-e3b1000-20260605d-feature")
              print("fan_checker", checker.exe_path)
              print("fan_checker_smoke", smoke)
              print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count())
              print("MahjongGB import ok")
              PY
              BASE=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527/models/transformer_candidate_finetune_e3b1000_elo2400_5ep_l40_20260604a.pt
              BASE_SHA256=759ddb9bd27e29d48567b69e1bf0ef24a9bdb7d8dfe76c1a0c59927a292d3fff
              QADV=models/qadv_reranker_e3b1000_v1_terminal_best.pt
              SELECTED_LAMBDA=0.10
              OUT=data/processed/qadv_e3b1000_20260604a
              RUNS=runs/qadv_e3b1000_20260604a/rollout_signal_20260605d
              INITDATA=${OUT}/random_mcr_seed2026062500_initdata_200.jsonl
              test -s "${BASE}"
              test -s "${QADV}"
              mkdir -p "${OUT}" "${RUNS}"
              python - <<'PY'
              import hashlib
              from pathlib import Path
              base = Path("/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527/models/transformer_candidate_finetune_e3b1000_elo2400_5ep_l40_20260604a.pt")
              expected = "759ddb9bd27e29d48567b69e1bf0ef24a9bdb7d8dfe76c1a0c59927a292d3fff"
              actual = hashlib.sha256(base.read_bytes()).hexdigest()
              print("base_sha256", actual)
              if actual != expected:
                  raise SystemExit(f"base checkpoint sha mismatch: {actual} != {expected}")
              PY
              python scripts/generate_random_mcr_initdata.py \
                --out-jsonl "${INITDATA}" \
                --summary-out "${RUNS}/random_mcr_initdata_summary.json" \
                --games 200 \
                --start-seed 2026062500
              python scripts/generate_qadv_league_rollouts.py \
                --policy-spec "name=qadv010,policy=transformer_feature,model=${BASE},qadv_model=${QADV},qadv_lambda=${SELECTED_LAMBDA}" \
                --policy-spec "name=baseA,policy=transformer_feature,model=${BASE}" \
                --policy-spec "name=baseB,policy=transformer_feature,model=${BASE}" \
                --policy-spec "name=baseC,policy=transformer_feature,model=${BASE}" \
                --raw "${INITDATA}" \
                --games 200 \
                --max-turns 500 \
                --gamma 0.995 \
                --out-jsonl "${RUNS}/qadv_single_seat_vs_base3_rollouts_feature_random200.jsonl" \
                --summary-out "${RUNS}/qadv_single_seat_vs_base3_rollouts_feature_random200_summary.json" \
                --min-games 200 \
                --min-rows 1 \
                --min-nonzero-score-rate 0.05 \
                --min-return-std 0.03 \
                --require-policy-pool-size 4 \
                --max-huang-rate 0.01 \
                --min-total-hu-rate 0.99 \
                --target-policy-hu-rate 0.25 \
                --min-policy-hu-rate 0.20 \
                --checked-policy-name qadv010 \
                --baseline-policy-name baseA \
                --baseline-policy-name baseB \
                --baseline-policy-name baseC \
                --min-checked-hu-lift 0.25 \
                --no-hu-terminal-penalty -1.0
              python - <<'PY'
              import json
              from pathlib import Path

              summary_path = Path("runs/qadv_e3b1000_20260604a/rollout_signal_20260605d/qadv_single_seat_vs_base3_rollouts_feature_random200_summary.json")
              qadv_summary_path = Path("runs/qadv_e3b1000_20260604a/qadv_reranker_v1_terminal_summary.json")
              summary = json.loads(summary_path.read_text())
              qadv_summary = json.loads(qadv_summary_path.read_text())
              selected_lambda = "0.10"
              safe_val = {str(item.get("lambda")): item for item in qadv_summary.get("safe_val_lambdas") or []}
              if selected_lambda not in safe_val:
                  raise SystemExit(f"selected lambda {selected_lambda} was not validation-safe")
              safety_failures = {
                  key: summary.get(key)
                  for key in ("illegal_hu_count", "low_fan_hu_count", "action_outside_mask_count")
                  if int(summary.get(key) or 0) != 0
              }
              if safety_failures:
                  raise SystemExit(f"unsafe rollout signal run: {safety_failures}")
              status = {
                  "format": "mcr_qadv_rollout_signal_gate_v1",
                  "source": "deterministic_random_mcr_wall_feature_state_single_checked_qadv_seat_vs_three_base_smoke",
                  "base_checkpoint": "/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527/models/transformer_candidate_finetune_e3b1000_elo2400_5ep_l40_20260604a.pt",
                  "base_sha256": "759ddb9bd27e29d48567b69e1bf0ef24a9bdb7d8dfe76c1a0c59927a292d3fff",
                  "qadv_model": "models/qadv_reranker_e3b1000_v1_terminal_best.pt",
                  "selected_lambda": selected_lambda,
                  "selected_by": "validation safe lambda with best validation relaxed and PLAY relaxed accuracy",
                  "seat_layout": "one qadv010 checked seat per game against three base fine-tuned seats; checked seat rotates by game index",
                  "policy_runtime": "transformer_feature: full FeatureAgent observation, history tokens, and rule features",
                  "summary": str(summary_path),
                  "gate_passed": bool(summary.get("gate_passed")),
                  "gate_failures": summary.get("gate_failures") or {},
                  "next_training_allowed": bool(summary.get("gate_passed")),
                  "metrics_to_monitor": {
                      "policy_hu_rates": summary.get("policy_hu_rates"),
                      "policy_hu_rate_sum": summary.get("policy_hu_rate_sum"),
                      "policy_hu_rate_target": summary.get("policy_hu_rate_target"),
                      "policy_min_hu_rate_gate": summary.get("policy_min_hu_rate_gate"),
                      "policy_hu_rate_denominator": summary.get("policy_hu_rate_denominator"),
                      "policy_average_final_score_rewards_4_2_1_0": summary.get("policy_average_final_score_rewards_4_2_1_0"),
                      "policy_average_hu_turns": summary.get("policy_average_hu_turns"),
                      "policy_hu_turn_definition": summary.get("policy_hu_turn_definition"),
                      "self_play_guideline": summary.get("self_play_guideline"),
                      "hu_rate": summary.get("hu_rate"),
                      "huang_rate": summary.get("huang_rate"),
                      "huang_games": summary.get("huang_games"),
                      "seat_labels": summary.get("seat_labels"),
                      "seat_hu_rates": summary.get("seat_hu_rates"),
                      "seat_hu_rate_sum": summary.get("seat_hu_rate_sum"),
                      "seat_average_hu_turns": summary.get("seat_average_hu_turns"),
                      "seat_average_raw_scores": summary.get("seat_average_raw_scores"),
                      "policy_diagnostics_totals": summary.get("policy_diagnostics_totals"),
                      "illegal_hu_count": summary.get("illegal_hu_count"),
                  },
                  "note": "Do not train from these rollout rows unless gate_passed is true.",
              }
              Path("runs/qadv_e3b1000_20260604a/rollout_signal_20260605d/rollout_signal_gate_status.json").write_text(
                  json.dumps(status, ensure_ascii=False, indent=2)
              )
              print(json.dumps(status, ensure_ascii=False))
              PY
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 80Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 120Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
