apiVersion: batch/v1
kind: Job
metadata:
  name: feature-agent-botzone98209-slide-fpn85vec-exact-noaug-2xgpu-20260617b
  namespace: nourish-sdsc
  labels:
    app: feature-agent
    task: botzone98209-slide-fpn85vec-exact-noaug-supervised
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 604800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: feature-agent
        task: botzone98209-slide-fpn85vec-exact-noaug-supervised
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40S
                      - NVIDIA-L40
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-RTX-A6000
                      - NVIDIA-RTX-A5000
                      - NVIDIA-A40
                      - NVIDIA-A10
                      - NVIDIA-L4
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                      - Tesla-V100-SXM2-32GB
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: feature-agent-train
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              DATA_ROOT=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
              BASE_RUN=feature_agent_botzone98209_2xgpu_20260615b
              RUN=feature_agent_botzone98209_slide_fpn85vec_exact_noaug_2xgpu_20260617b
              WORK=/tmp/${RUN}
              SRC=/opt/feature-agent-src
              TRANSCRIPT="${DATA_ROOT}/data/processed/${BASE_RUN}/botzone_2026_strong_ai_feature.txt"
              VEC_DIR="${DATA_ROOT}/data/processed/${BASE_RUN}/data-vec"
              export RUN BASE_RUN TRANSCRIPT VEC_DIR
              mkdir -p "${WORK}/feature-agent" "${DATA_ROOT}/runs/${RUN}" "${DATA_ROOT}/models/${RUN}"
              cp "${SRC}"/*.py "${WORK}/feature-agent/"
              cd "${WORK}/feature-agent"
              python -m pip install --no-cache-dir PyMahjongGB
              python -m py_compile agent.py audit_data_vec.py dataset.py feature.py model.py parallel.py preprocess.py supervised.py
              python - <<'PY'
              import json
              import os
              from pathlib import Path

              import numpy as np
              import torch
              from feature import FeatureAgent
              from model import SlideFPNModel

              vec_dir = Path(os.environ["VEC_DIR"])
              transcript = Path(os.environ["TRANSCRIPT"])
              counts = json.loads((vec_dir / "count.json").read_text())
              with np.load(vec_dir / "0.npz") as d:
                  shapes = {key: tuple(d[key].shape) for key in d.files}
                  sample_obs = d["obs"][:2]
                  sample_mask = d["mask"][:2]
                  sample_vec = d["vec"][:2]
              assert transcript.is_file() and transcript.stat().st_size > 0, transcript
              assert len(counts) == 98209, len(counts)
              assert sum(counts) == 5865816, sum(counts)
              assert shapes["obs"][1:] == (85, 4, 9), shapes
              assert shapes["mask"][1] == 235, shapes
              assert shapes["vec"][1] == 117, shapes
              assert FeatureAgent.OBS_SIZE == 85, FeatureAgent.OBS_SIZE
              assert FeatureAgent.ACT_SIZE == 235, FeatureAgent.ACT_SIZE
              assert FeatureAgent.VEC_SIZE == 117, FeatureAgent.VEC_SIZE
              assert torch.cuda.is_available()
              assert torch.cuda.device_count() >= 2
              model = SlideFPNModel(
                  obs_dim=85,
                  vec_dim=117,
                  hidden=128,
                  num_fpn_blocks=2,
                  fc_hidden=256,
                  residual_style="input",
                  use_vec=True,
                  vec_hidden=128,
              )
              logits = model({
                  "is_training": False,
                  "obs": {
                      "observation": torch.from_numpy(sample_obs).float(),
                      "action_mask": torch.from_numpy(sample_mask).float(),
                      "vec": torch.from_numpy(sample_vec).float(),
                  },
              })
              assert tuple(logits.shape) == (sample_obs.shape[0], 235), logits.shape
              cached_bytes = sum(counts) * (85 * 4 * 9 + 235 + 117 * 2 + 8)
              memory_estimate_gib = cached_bytes / (1024 ** 3)
              print(json.dumps({
                  "run": os.environ["RUN"],
                  "base_run": os.environ["BASE_RUN"],
                  "matches": len(counts),
                  "samples": sum(counts),
                  "train_matches_90": int(len(counts) * 0.9),
                  "validation_matches_10": len(counts) - int(len(counts) * 0.9),
                  "first_shapes": shapes,
                  "model_kind": "slide-fpn",
                  "split_mode": "contiguous",
                  "augment_mode": "none",
                  "slide_fpn_obs_planes": 85,
                  "slide_fpn_blocks": 2,
                  "slide_fpn_residual": "input",
                  "slide_fpn_use_vec": True,
                  "slide_fpn_vec_hidden": 128,
                  "fc_hidden": 256,
                  "parameter_count": sum(p.numel() for p in model.parameters()),
                  "sample_logits_shape": tuple(logits.shape),
                  "estimated_cached_npz_gib": memory_estimate_gib,
                  "memory_request_gib": 48,
                  "memory_expected_request_ratio": memory_estimate_gib / 48,
                  "torch": torch.__version__,
                  "cuda": torch.cuda.is_available(),
                  "device_count": torch.cuda.device_count(),
              }, sort_keys=True), flush=True)
              PY
              python supervised.py \
                --data-folder "${VEC_DIR}" \
                --version "${RUN}" \
                --log-root "${DATA_ROOT}/models/feature_agent_checkpoints" \
                --runs-root "${DATA_ROOT}/runs/feature_agent_tensorboard" \
                --epochs 30 \
                --batch-size 8192 \
                --lr 0.0005 \
                --split-ratio 0.9 \
                --split-mode contiguous \
                --device cuda \
                --data-parallel \
                --num-workers 0 \
                --no-augment \
                --augment-mode none \
                --model-kind slide-fpn \
                --hidden 128 \
                --slide-fpn-obs-planes 85 \
                --slide-fpn-blocks 2 \
                --slide-fpn-residual input \
                --slide-fpn-use-vec \
                --slide-fpn-vec-hidden 128 \
                --fc-hidden 256
              cp "${DATA_ROOT}/models/feature_agent_checkpoints/${RUN}/final.pkl" "${DATA_ROOT}/models/${RUN}/final.pkl"
          resources:
            requests:
              cpu: "16"
              memory: 48Gi
              ephemeral-storage: 20Gi
              nvidia.com/gpu: 2
            limits:
              cpu: "19"
              memory: 57Gi
              ephemeral-storage: 80Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - name: feature-agent-src
              mountPath: /opt/feature-agent-src
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: feature-agent-src
          configMap:
            name: feature-agent-src-slide-fpn-noaug-20260617b
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
