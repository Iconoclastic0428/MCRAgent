apiVersion: batch/v1
kind: Job
metadata:
  name: mcr-transformer-l40-reviewed-overfit-20260527a
  namespace: nourish-sdsc
  labels:
    app: mcr-transformer
    task: chaga0208-reviewed-overfit
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: mcr-transformer
        task: chaga0208-reviewed-overfit
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: reviewed-overfit
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command:
            - sh
            - -lc
            - |
              set -eux
              python -m pip install --no-cache-dir PyMahjongGB
              python - <<'PY'
              import torch
              import MahjongGB
              print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count())
              print("MahjongGB import ok")
              PY
              python scripts/train_transformer_candidate.py \
                --raw data/processed/chaga0208/tziakcha_chaga0208_all.jsonl \
                --eval-raw data/processed/chaga0208/tziakcha_chaga0208_all.jsonl \
                --review-audit-jsonl runs/chaga_review_alignment_audit_all.jsonl \
                --train-reviewed-only \
                --val-reviewed-only \
                --require-teacher-distribution \
                --max-candidates 235 \
                --hard-loss-weight 0.0 \
                --teacher-loss-weight 1.0 \
                --value-loss-weight 0.0 \
                --teacher-temperature 0.2 \
                --monitor-metric val_teacher_relaxed_accuracy \
                --epochs 160 \
                --batch-size 128 \
                --lr 0.0007 \
                --weight-decay 0.0 \
                --d-model 384 \
                --nhead 8 \
                --num-layers 6 \
                --dim-feedforward 1024 \
                --dropout 0.0 \
                --out models/transformer_candidate_reviewed_overfit_l40_20260527a.pt \
                --metrics-out runs/transformer_candidate_reviewed_overfit_l40_20260527a_metrics.json
              python scripts/evaluate_transformer_chaga_review.py \
                --checkpoint models/transformer_candidate_reviewed_overfit_l40_20260527a.pt \
                --raw data/processed/chaga0208/tziakcha_chaga0208_all.jsonl \
                --review-audit-jsonl runs/chaga_review_alignment_audit_all.jsonl \
                --max-candidates 235 \
                --batch-size 128 \
                --metrics-out runs/transformer_candidate_reviewed_overfit_l40_20260527a_original_eval.json
              python - <<'PY'
              import json
              from pathlib import Path
              metrics = json.loads(Path("runs/transformer_candidate_reviewed_overfit_l40_20260527a_original_eval.json").read_text())
              train = json.loads(Path("runs/transformer_candidate_reviewed_overfit_l40_20260527a_metrics.json").read_text())
              gate = {
                  "checkpoint": "models/transformer_candidate_reviewed_overfit_l40_20260527a.pt",
                  "train_metrics": "runs/transformer_candidate_reviewed_overfit_l40_20260527a_metrics.json",
                  "original_eval": "runs/transformer_candidate_reviewed_overfit_l40_20260527a_original_eval.json",
                  "train_review_filter_summary": train.get("train_review_filter_summary"),
                  "val_review_filter_summary": train.get("val_review_filter_summary"),
                  "evaluated_candidate_width": metrics.get("evaluated_candidate_width"),
                  "candidate_truncation_count": metrics.get("candidate_truncation_count"),
                  "reviewed_without_teacher_distribution": metrics.get("reviewed_without_teacher_distribution"),
                  "original_top1_accuracy": metrics.get("original_top1_accuracy"),
                  "original_relaxed_accuracy": metrics.get("original_relaxed_accuracy"),
                  "original_play_relaxed_accuracy": metrics.get("original_play_relaxed_accuracy"),
              }
              gate["passed"] = (
                  gate["train_review_filter_summary"]
                  and gate["val_review_filter_summary"]
                  and gate["train_review_filter_summary"].get("reviewed_examples_after_filter", 0) > 0
                  and gate["train_review_filter_summary"].get("reviewed_examples_after_filter") == gate["val_review_filter_summary"].get("reviewed_examples_after_filter")
                  and gate["reviewed_without_teacher_distribution"] == 0
                  and gate["candidate_truncation_count"] == 0
                  and gate["evaluated_candidate_width"] == 235
                  and (gate["original_relaxed_accuracy"] or 0.0) >= 0.95
                  and (gate["original_top1_accuracy"] or 0.0) >= 0.85
                  and (gate["original_play_relaxed_accuracy"] or 0.0) >= 0.95
              )
              Path("runs/transformer_candidate_reviewed_overfit_l40_20260527a_gate.json").write_text(json.dumps(gate, ensure_ascii=False, indent=2))
              print(json.dumps(gate, ensure_ascii=False, indent=2))
              if not gate["passed"]:
                  raise SystemExit("reviewed-only overfit gate failed")
              PY
          resources:
            requests:
              cpu: "8"
              memory: 48Gi
              ephemeral-storage: "0"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 48Gi
              ephemeral-storage: 50Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
