<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tziakcha MCR Model Advisor</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101418;
      color: #e8edf2;
    }

    body {
      margin: 24px;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }

    .panel {
      border: 1px solid #34404b;
      border-radius: 8px;
      padding: 14px;
      background: #151b21;
    }

    .panel-wide {
      grid-column: 1 / -1;
    }

    .label {
      color: #9fb0c0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 8px;
    }

    .rec {
      font-size: 34px;
      font-weight: 750;
      color: #7dd3fc;
      min-height: 42px;
    }

    .hand {
      font-size: 22px;
      line-height: 1.6;
      word-spacing: 8px;
    }

    code {
      display: block;
      white-space: pre-wrap;
      color: #d7dde5;
      font-size: 13px;
      line-height: 1.45;
      max-height: 460px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>Tziakcha MCR Model Advisor</h1>
    <div class="grid">
      <section class="panel">
        <div class="label">Recommendation</div>
        <div id="rec" class="rec">Waiting</div>
      </section>
      <section class="panel">
        <div class="label">Hand</div>
        <div id="hand" class="hand"></div>
      </section>
      <section class="panel panel-wide">
        <div class="label">Results</div>
        <div id="results" class="hand"></div>
      </section>
      <section class="panel panel-wide">
        <div class="label">State</div>
        <code id="state"></code>
      </section>
    </div>
  </main>
  <script>
    async function refresh() {
      const [state, rec, results] = await Promise.all([
        fetch('/state').then((r) => r.json()),
        fetch('/recommendation').then((r) => r.json()),
        fetch('/results').then((r) => r.json())
      ]);
      const stats = results.stats || {};
      document.getElementById('rec').textContent = rec.text || 'Waiting';
      document.getElementById('hand').textContent = (state.hand_display || []).join(' ');
      document.getElementById('results').textContent = [
        `Games ${stats.games || 0}`,
        `Win ${(100 * (stats.win_rate || 0)).toFixed(1)}%`,
        `Deal-in ${(100 * (stats.deal_in_rate || 0)).toFixed(1)}%`,
        `Avg ${Number(stats.average_score_delta || 0).toFixed(1)}`
      ].join(' | ');
      document.getElementById('state').textContent = JSON.stringify(state, null, 2);
    }

    setInterval(refresh, 1000);
    refresh().catch((error) => {
      document.getElementById('rec').textContent = String(error);
    });
  </script>
</body>
</html>
