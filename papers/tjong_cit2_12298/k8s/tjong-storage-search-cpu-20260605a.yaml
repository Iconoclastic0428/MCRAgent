apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-storage-search-cpu-20260605a
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: storage-search
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: tjong-replication
        task: storage-search
    spec:
      restartPolicy: Never
      containers:
        - name: tjong-storage-search
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              python - <<'PY'
              import json
              from pathlib import Path

              root = Path("/data/idl")
              patterns = ("botzone", "mcr", "tziakcha")
              names = []
              probed_dirs = []
              candidate_dirs = [
                  root / "mcr_agent_transformer_20260527_0029" / "mcr_transformer_sync_20260527" / "data" / "raw",
                  root / "mcr_agent_transformer_20260527_0029" / "mcr_transformer_sync_20260527" / "data",
                  root / "mcr_agent_transformer_20260527_0029" / "data" / "raw",
                  root / "mcr_agent_transformer_20260527_0029" / "data",
                  root / "data" / "raw",
                  root / "data",
              ]
              for child in root.iterdir():
                  if child.is_dir() and child.name.startswith(("mcr_", "mcr-agent", "mcr_agent")):
                      candidate_dirs.extend([child / "data" / "raw", child / "data"])
              seen_dirs = set()
              for directory in candidate_dirs:
                  key = str(directory)
                  if key in seen_dirs:
                      continue
                  seen_dirs.add(key)
                  item = {"path": key, "exists": directory.exists(), "is_dir": directory.is_dir()}
                  probed_dirs.append(item)
                  if not directory.is_dir():
                      continue
                  try:
                      children = list(directory.iterdir())
                  except OSError as exc:
                      item["error"] = str(exc)
                      continue
                  item["entry_count"] = len(children)
                  for path in children:
                      if not path.is_file():
                          continue
                      lower = path.name.lower()
                      if not (lower.endswith(".jsonl") or lower.endswith(".jsonl.gz")):
                          continue
                      if not any(pattern in lower for pattern in patterns):
                          continue
                      try:
                          size = path.stat().st_size
                      except OSError:
                          size = None
                      names.append({"path": str(path), "bytes": size})
              names.sort(key=lambda item: (item["path"]))
              report = {
                  "format": "tjong_storage_targeted_search_v1",
                  "root": str(root),
                  "patterns": list(patterns),
                  "result_count": len(names),
                  "results": names,
                  "probed_dirs": probed_dirs,
                  "paper_scale_candidates": [
                      item for item in names
                      if "519338" in item["path"] or "botzone_mcr" in item["path"] or "tziakcha" in item["path"].lower()
                  ],
              }
              out = Path("/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527/runs/tjong_storage_search_20260605a.json")
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
              print(json.dumps(report, ensure_ascii=False, sort_keys=True))
              PY
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 8Gi
            limits:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 16Gi
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
