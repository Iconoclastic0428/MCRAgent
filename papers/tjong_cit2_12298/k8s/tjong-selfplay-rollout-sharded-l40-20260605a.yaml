apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-selfplay-rollout-sharded-l40-20260605a
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: selfplay-rollout-sharded
spec:
  completionMode: Indexed
  completions: 32
  parallelism: 8
  backoffLimit: 0
  activeDeadlineSeconds: 259200
  template:
    metadata:
      labels:
        app: tjong-replication
        task: selfplay-rollout-sharded
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: tjong-selfplay-shard
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              SHARD_INDEX="${JOB_COMPLETION_INDEX:-${HOSTNAME##*-}}"
              TOTAL_GAMES="${TJONG_SELFPLAY_TOTAL_GAMES:-763471}"
              SHARDS="${TJONG_SELFPLAY_SHARDS:-32}"
              SELFPLAY_MIN_GAMES="${TJONG_SELFPLAY_MIN_GAMES:-519338}"
              MIN_TOTAL_HU_RATE="${TJONG_MIN_TOTAL_HU_RATE:-0.99}"
              MAX_HUANG_RATE="${TJONG_MAX_HUANG_RATE:-0.01}"
              BASE_GAMES=$((TOTAL_GAMES / SHARDS))
              REMAINDER=$((TOTAL_GAMES % SHARDS))
              if [ "${SHARD_INDEX}" -lt "${REMAINDER}" ]; then
                SHARD_GAMES=$((BASE_GAMES + 1))
                OFFSET=$((SHARD_INDEX * (BASE_GAMES + 1)))
              else
                SHARD_GAMES="${BASE_GAMES}"
                OFFSET=$((REMAINDER * (BASE_GAMES + 1) + (SHARD_INDEX - REMAINDER) * BASE_GAMES))
              fi
              SHARD_TAG="$(printf "%04d" "${SHARD_INDEX}")"
              python - <<'PY'
              import os
              import torch
              print("repo_commit", "tjong-selfplay-rollout-sharded-l40-20260605a")
              print("shard", os.environ.get("JOB_COMPLETION_INDEX"), "torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count())
              PY
              apt-get update
              apt-get install -y libboost-dev libjsoncpp-dev
              python -m pip install --no-cache-dir PyMahjongGB
              JUDGE_DIR="/tmp/tjong_official_judge_${SHARD_TAG}"
              mkdir -p "${JUDGE_DIR}/MahjongGB" "${JUDGE_DIR}/jsoncpp"
              cp external/Chinese-Standard-Mahjong/judge/main.cpp "${JUDGE_DIR}/main.cpp"
              cp external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/*.cpp "${JUDGE_DIR}/MahjongGB/"
              cp external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/*.h "${JUDGE_DIR}/MahjongGB/"
              cp /usr/include/jsoncpp/json/*.h "${JUDGE_DIR}/jsoncpp/"
              g++ -O2 -std=c++14 \
                -D_BOTZONE_ONLINE \
                "${JUDGE_DIR}/main.cpp" \
                -I"${JUDGE_DIR}" \
                -I/usr/include \
                -ljsoncpp \
                -o "${JUDGE_DIR}/mcr_judge.exe"
              g++ -O2 -std=c++14 \
                scripts/mcr_fan_check.cpp \
                "${JUDGE_DIR}/MahjongGB/shanten.cpp" \
                -I"${JUDGE_DIR}" \
                -I/usr/include \
                -ljsoncpp \
                -o "${JUDGE_DIR}/mcr_fan_check.exe"
              test -x "${JUDGE_DIR}/mcr_judge.exe"
              test -x "${JUDGE_DIR}/mcr_fan_check.exe"
              INIT="${TJONG_POLICY_CHECKPOINT:-models/tjong_supervised_all_sources_20260605a.pt}"
              RAW_INITDATA="${TJONG_RAW_INITDATA:-data/processed/tjong/tziakcha_all_sources_botzone_20260605a_initdata.jsonl}"
              SHARD_DIR="${TJONG_SELFPLAY_SHARD_DIR:-data/processed/tjong/selfplay_shards_20260605a}"
              TENSOR_ENCODING_VERSION="${TJONG_TENSOR_ENCODING_VERSION:-tjong_cit2_12298_v3_hidden_concealed_kong}"
              mkdir -p "${SHARD_DIR}"
              RAW_OUT="${SHARD_DIR}/tjong_selfplay_raw_shard_${SHARD_TAG}.jsonl"
              FAN_OUT="${SHARD_DIR}/tjong_selfplay_fan_items_shard_${SHARD_TAG}.jsonl"
              SUMMARY_OUT="${SHARD_DIR}/tjong_selfplay_summary_shard_${SHARD_TAG}.json"
              test -s "${INIT}"
              test -s "${RAW_INITDATA}"
              python -m tjong_replication.collect_selfplay \
                --checkpoint "${INIT}" \
                --raw "${RAW_INITDATA}" \
                --games "${SHARD_GAMES}" \
                --offset "${OFFSET}" \
                --judge "${JUDGE_DIR}/mcr_judge.exe" \
                --fan-checker "${JUDGE_DIR}/mcr_fan_check.exe" \
                --out-raw "${RAW_OUT}" \
                --out-fan-items "${FAN_OUT}" \
                --summary-out "${SUMMARY_OUT}" \
                --require-encoding-version "${TENSOR_ENCODING_VERSION}" \
                --require-paper-config \
                --device cuda
              test -s "${RAW_OUT}"
              test -s "${FAN_OUT}"
              export SHARD_GAMES MIN_TOTAL_HU_RATE MAX_HUANG_RATE SUMMARY_OUT
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              summary = json.loads(Path(os.environ["SUMMARY_OUT"]).read_text())
              assert int(summary.get("games", -1)) == int(os.environ["SHARD_GAMES"]), summary
              assert "score_table" in summary and len(summary["score_table"]) == 4, summary
              assert "per_player" in summary and len(summary["per_player"]) == 4, summary
              assert float(summary.get("hu_rate") or 0.0) >= float(os.environ["MIN_TOTAL_HU_RATE"]), summary
              assert float(summary.get("huang_rate") or 0.0) <= float(os.environ["MAX_HUANG_RATE"]), summary
              PY
          resources:
            limits:
              cpu: "4"
              memory: 48Gi
              ephemeral-storage: 120Gi
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 48Gi
              ephemeral-storage: 80Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
