apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-hu-tensorize-sharded-cpu-20260607e
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: hu-sharded-tensorize
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 259200
  template:
    metadata:
      labels:
        app: tjong-replication
        task: hu-sharded-tensorize
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-haosu-22.sdsc.optiputer.net
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: hu-sharded-tensorize
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              python -m py_compile \
                papers/tjong_cit2_12298/src/tjong_replication/tensorize_botzone.py \
                papers/tjong_cit2_12298/src/tjong_replication/train_supervised.py
              python - <<'PY'
              from pathlib import Path
              tensorizer = Path("papers/tjong_cit2_12298/src/tjong_replication/tensorize_botzone.py").read_text(encoding="utf-8")
              trainer = Path("papers/tjong_cit2_12298/src/tjong_replication/train_supervised.py").read_text(encoding="utf-8")
              assert "SHARD_INDEX_FORMAT" in tensorizer, "missing sharded tensorizer ABI"
              assert "compact_storage" in tensorizer, "missing compact supervised shard storage"
              assert "single_action_discard_stride: int = 1" in tensorizer, "default must keep all single-action discards"
              assert "apply_deal_requests" in tensorizer, "converted Botzone DEAL content must reconstruct hands"
              assert "--num-workers" in tensorizer, "missing tensorizer worker CLI"
              assert "ShardedTensorDataset" in trainer, "supervised trainer must load shard indexes"
              print("source_sharded_hu_tensorizer_ready", True, flush=True)
              PY

              RAW_TAG=20260606b
              TAG=20260607e
              SHARD_MAX_EXAMPLES="${TJONG_SHARD_MAX_EXAMPLES:-50000}"
              WORKERS="${TJONG_TENSORIZE_WORKERS:-0}"
              ALL_BOTZONE=data/raw/tziakcha_all_sources_botzone_hu_${RAW_TAG}.jsonl
              VALIDATION=runs/tjong_validate_tziakcha_all_sources_botzone_hu_${RAW_TAG}.json
              HU_AUDIT=runs/tjong_hu_restore_audit_${RAW_TAG}.json
              SHARD_DIR=data/processed/tjong/tziakcha_all_sources_botzone_hu_${TAG}_shards
              TRAIN_INDEX=${SHARD_DIR}/index.json
              TENSORIZE_SUMMARY=runs/tjong_tensorize_all_sources_hu_${TAG}_summary.json

              test -s "${ALL_BOTZONE}"
              test -s "${VALIDATION}"
              test -s "${HU_AUDIT}"
              test ! -e "${SHARD_DIR}"
              EXPECTED_RECORDS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["records"])' "${VALIDATION}")"
              export VALIDATION HU_AUDIT EXPECTED_RECORDS SHARD_MAX_EXAMPLES WORKERS
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              audit = json.loads(Path(os.environ["HU_AUDIT"]).read_text(encoding="utf-8"))
              validation = json.loads(Path(os.environ["VALIDATION"]).read_text(encoding="utf-8"))
              assert int(audit.get("hu_response_count", 0)) > 0, audit
              assert int(audit.get("bad_hu_count", -1)) == 0, audit
              assert validation.get("valid_for_paper_supervised") is True, validation
              assert int(validation.get("records", 0)) == int(os.environ["EXPECTED_RECORDS"]), validation
              assert int(os.environ["SHARD_MAX_EXAMPLES"]) > 0
              print(
                  "sharded_tensorize_preflight",
                  {
                      "records": int(validation.get("records", 0)),
                      "hu_response_count": int(audit.get("hu_response_count", 0)),
                      "bad_hu_count": int(audit.get("bad_hu_count", -1)),
                      "shard_max_examples": int(os.environ["SHARD_MAX_EXAMPLES"]),
                      "workers": int(os.environ["WORKERS"]),
                  },
                  flush=True,
              )
              PY

              python -m tjong_replication.tensorize_botzone \
                --in "${ALL_BOTZONE}" \
                --shard-dir "${SHARD_DIR}" \
                --shard-index-out "${TRAIN_INDEX}" \
                --summary-out "${TENSORIZE_SUMMARY}" \
                --corpus-validation "${VALIDATION}" \
                --compact-metadata \
                --compact-storage \
                --shard-max-examples "${SHARD_MAX_EXAMPLES}" \
                --num-workers "${WORKERS}" \
                --progress-every 50000 \
                --single-action-discard-stride 1
              export TENSORIZE_SUMMARY TRAIN_INDEX SHARD_DIR SHARD_MAX_EXAMPLES
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              summary = json.loads(Path(os.environ["TENSORIZE_SUMMARY"]).read_text(encoding="utf-8"))
              index = json.loads(Path(os.environ["TRAIN_INDEX"]).read_text(encoding="utf-8"))
              stats = summary.get("stats") or {}
              action_hu = int(stats.get("action:HU", 0))
              action_discard = int(stats.get("action:DISCARD", 0))
              expected_actions = {
                  "CHOW": 1829984,
                  "PONG": 1274394,
                  "MINGKONG": 58468,
                  "BUKONG": 71554,
                  "ANKONG": 44483,
                  "HU": 745368,
              }
              label_outside_hu = int(stats.get("label_outside_mask:HU", 0) or 0)
              discard_seen = int(stats.get("single_action_discard_seen", 0))
              discard_kept = int(stats.get("single_action_discard_kept", 0))
              sampled_out = int(stats.get("single_action_discard_sampled_out", 0) or 0)
              examples = int(summary.get("examples", 0))
              matches = int(stats.get("matches", 0))
              shard_max = int(os.environ["SHARD_MAX_EXAMPLES"])
              assert summary == index, "summary and shard index diverged"
              assert summary.get("format") == "tjong_tensor_shards_v1", summary
              assert summary.get("sharded") is True, summary
              assert summary.get("compact_metadata") is True, summary
              assert summary.get("compact_storage") is True, summary
              assert int(summary.get("single_action_discard_stride", 0)) == 1, summary
              assert action_hu > 0, summary
              assert label_outside_hu == 0, summary
              assert discard_seen > 0, summary
              assert discard_kept == discard_seen, summary
              assert sampled_out == 0, summary
              assert action_discard > action_hu, summary
              for action, expected in expected_actions.items():
                  observed = int(stats.get(f"action:{action}", 0))
                  assert observed == expected, {"action": action, "observed": observed, "expected": expected}
              assert matches > 0 and examples / matches > 10.0, summary
              shards = summary.get("shards") or []
              assert shards, summary
              total = 0
              for shard in shards:
                  path = Path(os.environ["SHARD_DIR"]) / shard["path"]
                  assert path.is_file(), shard
                  assert len(str(shard.get("sha256", ""))) == 64, shard
                  count = int(shard.get("examples", 0))
                  assert 0 < count <= shard_max, shard
                  total += count
              assert total == examples, {"total": total, "examples": examples}
              print(
                  "tensor_hu_sharded_gate",
                  {
                      "examples": examples,
                      "matches": matches,
                      "examples_per_match": examples / matches,
                      "action_DISCARD": action_discard,
                      "action_HU": action_hu,
                      "action_CHOW": int(stats.get("action:CHOW", 0)),
                      "action_PONG": int(stats.get("action:PONG", 0)),
                      "action_MINGKONG": int(stats.get("action:MINGKONG", 0)),
                      "action_BUKONG": int(stats.get("action:BUKONG", 0)),
                      "action_ANKONG": int(stats.get("action:ANKONG", 0)),
                      "label_outside_mask_HU": label_outside_hu,
                      "action_mask_repaired": {
                          key.split(":", 1)[1]: int(value)
                          for key, value in stats.items()
                          if key.startswith("action_mask_repaired:")
                      },
                      "single_action_discard_seen": discard_seen,
                      "single_action_discard_kept": discard_kept,
                      "shards": len(shards),
                  },
                  flush=True,
              )
              PY
          resources:
            requests:
              cpu: "2"
              memory: 96Gi
              ephemeral-storage: 80Gi
            limits:
              cpu: "2"
              memory: 96Gi
              ephemeral-storage: 120Gi
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
