apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-supervised-eval-sweep-l40-20260605b
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: supervised-eval-sweep
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: tjong-replication
        task: supervised-eval-sweep
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
        - key: nautilus.io/reservation
          operator: Equal
          value: csu-tide
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: tjong-supervised-eval-sweep
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              FINAL_CHECKPOINT="${TJONG_FINAL_CHECKPOINT:-models/tjong_supervised_all_sources_20260605b.pt}"
              CHECKPOINT_DIR="${TJONG_CHECKPOINT_DIR:-models/tjong_supervised_all_sources_20260605b_checkpoints}"
              EVAL_PT="${TJONG_EVAL_PT:-data/processed/tjong/tziakcha_all_sources_botzone_20260605b_tensorized.pt}"
              RESULTS_JSONL="${TJONG_RESULTS_JSONL:-runs/tjong_supervised_all_sources_checkpoint_sweep_20260605b.jsonl}"
              TENSOR_ENCODING_VERSION="${TJONG_TENSOR_ENCODING_VERSION:-tjong_cit2_12298_v3_hidden_concealed_kong}"
              test -s "${FINAL_CHECKPOINT}"
              test -s "${EVAL_PT}"
              python -m tjong_replication.evaluate_checkpoints \
                --checkpoint "${FINAL_CHECKPOINT}" \
                --checkpoint-glob "${CHECKPOINT_DIR}/epoch_*.pt" \
                --checkpoint-glob "${CHECKPOINT_DIR}/batch_*.pt" \
                --eval-pt "${EVAL_PT}" \
                --metrics-out runs/tjong_supervised_all_sources_checkpoint_sweep_20260605b.json \
                --results-jsonl "${RESULTS_JSONL}" \
                --batch-size 1024 \
                --num-workers 0 \
                --require-encoding-version "${TENSOR_ENCODING_VERSION}" \
                --require-paper-config \
                --seed 0 \
                --strict-deterministic \
                --device cuda
          resources:
            limits:
              cpu: "4"
              memory: 64Gi
              ephemeral-storage: 100Gi
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 64Gi
              ephemeral-storage: 80Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
