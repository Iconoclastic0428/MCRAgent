apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-platform-wrapper-gate-cpu-20260612a
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: platform-wrapper-gate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: tjong-replication
        task: platform-wrapper-gate
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: platform-wrapper-gate
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: IfNotPresent
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
            - name: TJONG_RUN
              value: tjong_platform_wrapper_gate_cpu_20260612a
            - name: TJONG_BRANCH
              value: codex/tjong-paper-ppo-gate
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              DATA_ROOT=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
              DOWNLOAD_ROOT=/tmp/mcragent_tjong_platform_wrapper_gate_20260612a
              rm -rf "${DOWNLOAD_ROOT}"
              python - <<'PY'
              import os
              import shutil
              import urllib.request
              import zipfile
              from pathlib import Path

              branch = os.environ["TJONG_BRANCH"]
              url = f"https://github.com/Iconoclastic0428/MCRAgent/archive/refs/heads/{branch}.zip"
              root = Path("/tmp/mcragent_tjong_platform_wrapper_gate_20260612a")
              archive = Path("/tmp/mcragent_tjong_platform_wrapper_gate_20260612a.zip")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(url, archive)
              with zipfile.ZipFile(archive) as src:
                  src.extractall(root)
              children = [p for p in root.iterdir() if p.is_dir()]
              if len(children) != 1:
                  raise RuntimeError(f"unexpected archive layout: {children}")
              Path("/tmp/mcragent_tjong_platform_wrapper_gate_repo_path.txt").write_text(
                  str(children[0]), encoding="utf-8"
              )
              print("downloaded_branch_zip", url, children[0], flush=True)
              PY
              TEST_REPO=$(cat /tmp/mcragent_tjong_platform_wrapper_gate_repo_path.txt)
              cd "${TEST_REPO}"
              export PYTHONPATH="${TEST_REPO}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              CHECKPOINT="${TJONG_PLATFORM_CHECKPOINT:-${DATA_ROOT}/models/tjong_supervised_hu_ddp_full_4x4090_20260608d_checkpoints/latest.pt}"
              RAW="${TJONG_PLATFORM_RAW:-${DATA_ROOT}/data/raw/tziakcha_all_sources_botzone_20260605b.jsonl}"
              OUT="${TJONG_PLATFORM_GATE_OUT:-${DATA_ROOT}/runs/tjong_platform_wrapper_gate_20260612a.json}"
              MAX_STATES="${TJONG_PLATFORM_MAX_STATES:-1000}"
              MIN_STATES="${TJONG_PLATFORM_MIN_STATES:-100}"
              TENSOR_ENCODING_VERSION="${TJONG_TENSOR_ENCODING_VERSION:-tjong_cit2_12298_v3_hidden_concealed_kong}"
              test -s "papers/tjong_cit2_12298/src/tjong_replication/verify_platform_wrappers.py"
              test -s "scripts/tjong_botzone_json_policy_bot.py"
              EXTRA_ARGS=""
              if [ -n "${TJONG_PLATFORM_MIN_EXACT_ACC:-}" ]; then
                EXTRA_ARGS="${EXTRA_ARGS} --min-exact-accuracy ${TJONG_PLATFORM_MIN_EXACT_ACC}"
              fi
              if [ -n "${TJONG_PLATFORM_MIN_FAMILY_ACC:-}" ]; then
                EXTRA_ARGS="${EXTRA_ARGS} --min-family-accuracy ${TJONG_PLATFORM_MIN_FAMILY_ACC}"
              fi
              test -s "${CHECKPOINT}"
              test -s "${RAW}"
              python -m tjong_replication.verify_platform_wrappers \
                --checkpoint "${CHECKPOINT}" \
                --raw "${RAW}" \
                --max-states "${MAX_STATES}" \
                --nonpass-only \
                --device cpu \
                --require-encoding-version "${TENSOR_ENCODING_VERSION}" \
                --require-paper-config \
                --min-states "${MIN_STATES}" \
                --fail-on-error \
                --out "${OUT}" \
                ${EXTRA_ARGS}
              test -s "${OUT}"
          resources:
            limits:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 20Gi
            requests:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 10Gi
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
