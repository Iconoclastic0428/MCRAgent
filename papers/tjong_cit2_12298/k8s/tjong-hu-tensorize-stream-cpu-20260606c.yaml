apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-hu-tensorize-stream-cpu-20260606c
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: hu-stream-tensorize
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: tjong-replication
        task: hu-stream-tensorize
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-haosu-22.sdsc.optiputer.net
                      - rci-tide-gpu-11.sdsu.edu
      containers:
        - name: hu-stream-tensorize
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              python - <<'PY'
              from pathlib import Path
              tensorizer = Path("papers/tjong_cit2_12298/src/tjong_replication/tensorize_botzone.py").read_text(encoding="utf-8")
              rewards = Path("papers/tjong_cit2_12298/src/tjong_replication/populate_fan_backward_rewards.py").read_text(encoding="utf-8")
              rollouts = Path("papers/tjong_cit2_12298/src/tjong_replication/build_ppo_rollouts.py").read_text(encoding="utf-8")
              assert "tensorize_file_streaming" in tensorizer and "compact_metadata" in tensorizer
              assert "metadata_column" in rewards and "metadata_column" in rollouts
              print("source_streaming_tensorizer_ready", True, flush=True)
              PY

              RAW_TAG=20260606b
              TAG=20260606c
              ALL_BOTZONE=data/raw/tziakcha_all_sources_botzone_hu_${RAW_TAG}.jsonl
              VALIDATION=runs/tjong_validate_tziakcha_all_sources_botzone_hu_${RAW_TAG}.json
              HU_AUDIT=runs/tjong_hu_restore_audit_${RAW_TAG}.json
              TRAIN_PT=data/processed/tjong/tziakcha_all_sources_botzone_hu_${TAG}_tensorized.pt
              TENSORIZE_SUMMARY=runs/tjong_tensorize_all_sources_hu_${TAG}_summary.json
              RAW_INITDATA=data/processed/tjong/tziakcha_all_sources_botzone_hu_${TAG}_initdata.jsonl
              INITDATA_SUMMARY=runs/tjong_tziakcha_all_sources_initdata_hu_${TAG}_summary.json
              INITDATA_VALIDATION=runs/tjong_validate_tziakcha_all_sources_initdata_hu_${TAG}.json

              test -s "${ALL_BOTZONE}"
              test -s "${VALIDATION}"
              test -s "${HU_AUDIT}"
              export VALIDATION HU_AUDIT EXPECTED_RECORDS
              EXPECTED_RECORDS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["records"])' "${VALIDATION}")"
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              audit = json.loads(Path(os.environ["HU_AUDIT"]).read_text(encoding="utf-8"))
              validation = json.loads(Path(os.environ["VALIDATION"]).read_text(encoding="utf-8"))
              assert int(audit.get("hu_response_count", 0)) > 0, audit
              assert int(audit.get("bad_hu_count", -1)) == 0, audit
              assert validation.get("valid_for_paper_supervised") is True, validation
              assert int(validation.get("records", 0)) == int(os.environ["EXPECTED_RECORDS"]), validation
              print(
                  "stream_tensorize_preflight",
                  {
                      "records": int(validation.get("records", 0)),
                      "hu_response_count": int(audit.get("hu_response_count", 0)),
                      "bad_hu_count": int(audit.get("bad_hu_count", -1)),
                  },
                  flush=True,
              )
              PY

              python -m tjong_replication.tensorize_botzone \
                --in "${ALL_BOTZONE}" \
                --out "${TRAIN_PT}" \
                --summary-out "${TENSORIZE_SUMMARY}" \
                --corpus-validation "${VALIDATION}" \
                --streaming \
                --compact-metadata \
                --progress-every 50000
              export TENSORIZE_SUMMARY
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              summary = json.loads(Path(os.environ["TENSORIZE_SUMMARY"]).read_text(encoding="utf-8"))
              stats = summary.get("stats") or {}
              assert summary.get("streaming") is True, summary
              assert summary.get("compact_metadata") is True, summary
              assert int(stats.get("action:HU", 0)) > 0, summary
              assert int(stats.get("label_outside_mask:HU", 0) or 0) == 0, summary
              print(
                  "tensor_hu_gate",
                  {
                      "examples": int(summary.get("examples", 0)),
                      "action_HU": int(stats.get("action:HU", 0)),
                      "label_outside_mask_HU": int(stats.get("label_outside_mask:HU", 0) or 0),
                  },
                  flush=True,
              )
              PY

              python -m tjong_replication.convert_tziakcha_to_initdata \
                --in "${ALL_BOTZONE}" \
                --out "${RAW_INITDATA}" \
                --summary-out "${INITDATA_SUMMARY}" \
                --min-written "${EXPECTED_RECORDS}" \
                --allow-random-fallback \
                --fail-on-error
              python -m tjong_replication.validate_initdata_corpus \
                --in "${RAW_INITDATA}" \
                --expected-records "${EXPECTED_RECORDS}" \
                --summary-out "${INITDATA_VALIDATION}"
          resources:
            requests:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 160Gi
            limits:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 240Gi
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
