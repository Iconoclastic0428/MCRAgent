apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-v1-mhierbal-fresh-2x4090-20260613b
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: slide-v1-mhierbal-fresh-2x
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: tjong-replication
        task: slide-v1-mhierbal-fresh-2x
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-4090
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: slide-v1-mhierbal-fresh
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
              value: "1"
            - name: TJONG_GPU_COUNT
              value: "2"
            - name: TJONG_RUN
              value: tjong_slide_resnet_v1_maskedhier_balanced_fresh_2x4090_20260613b
            - name: TJONG_BATCH_SIZE
              value: "16384"
            - name: TJONG_LR
              value: "0.00001"
            - name: TJONG_L1_LAMBDA
              value: "0.0"
            - name: TJONG_L2_LAMBDA
              value: "0.0"
            - name: TJONG_WEIGHT_DECAY
              value: "0.0001"
            - name: TJONG_USE_HIDDEN_TILES
              value: "1"
            - name: TJONG_BRANCH
              value: codex/tjong-paper-ppo-gate
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              DATA_ROOT=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
              DOWNLOAD_ROOT=/tmp/mcragent_tjong_slide_resnet_v1_maskedhier_balanced_fresh_2x4090_20260613b
              rm -rf "${DOWNLOAD_ROOT}"
              python - <<'PY'
              import os
              import shutil
              import urllib.request
              import zipfile
              from pathlib import Path

              branch = os.environ["TJONG_BRANCH"]
              url = f"https://github.com/Iconoclastic0428/MCRAgent/archive/refs/heads/{branch}.zip"
              root = Path("/tmp/mcragent_tjong_slide_resnet_v1_maskedhier_balanced_fresh_2x4090_20260613b")
              archive = Path("/tmp/mcragent_tjong_slide_resnet_v1_maskedhier_balanced_fresh_2x4090_20260613b.zip")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(url, archive)
              with zipfile.ZipFile(archive) as src:
                  src.extractall(root)
              children = [p for p in root.iterdir() if p.is_dir()]
              if len(children) != 1:
                  raise RuntimeError(f"unexpected archive layout: {children}")
              Path("/tmp/mcragent_tjong_slide_resnet_v1_maskedhier_balanced_fresh_repo_path.txt").write_text(str(children[0]), encoding="utf-8")
              print("downloaded_branch_zip", url, children[0], flush=True)
              PY
              TEST_REPO=$(cat /tmp/mcragent_tjong_slide_resnet_v1_maskedhier_balanced_fresh_repo_path.txt)
              cd "${TEST_REPO}"
              export PYTHONPATH="${TEST_REPO}/papers/tjong_cit2_12298/src:${TEST_REPO}/scripts:${PYTHONPATH:-}"
              TRAIN_PT="${TJONG_TRAIN_PT:-${DATA_ROOT}/data/processed/tjong/tziakcha_all_sources_botzone_hu_20260607f_shards/index.json}"
              TENSORIZE_SUMMARY="${TJONG_TENSORIZE_SUMMARY:-${DATA_ROOT}/runs/tjong_tensorize_all_sources_hu_20260607f_summary.json}"
              TENSOR_ENCODING_VERSION="${TJONG_TENSOR_ENCODING_VERSION:-tjong_cit2_12298_v3_hidden_concealed_kong}"
              L1_LAMBDA="${TJONG_L1_LAMBDA:-0.0}"
              L2_LAMBDA="${TJONG_L2_LAMBDA:-0.0}"
              WEIGHT_DECAY="${TJONG_WEIGHT_DECAY:-0.0001}"
              BATCH_SIZE="${TJONG_BATCH_SIZE:-16384}"
              LR="${TJONG_LR:-0.00001}"
              export TRAIN_PT TENSORIZE_SUMMARY TENSOR_ENCODING_VERSION L1_LAMBDA L2_LAMBDA WEIGHT_DECAY LR
              HIDDEN_ARGS=""
              if [ "${TJONG_USE_HIDDEN_TILES:-0}" = "1" ]; then
                HIDDEN_ARGS="--use-hidden-tiles"
              fi
              test -s papers/tjong_cit2_12298/src/tjong_replication/slide_resnet.py
              test -s papers/tjong_cit2_12298/src/tjong_replication/train_slide_resnet_supervised.py
              test -s "${TRAIN_PT}"
              test -s "${TENSORIZE_SUMMARY}"
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              import torch

              summary = json.loads(Path(os.environ["TENSORIZE_SUMMARY"]).read_text(encoding="utf-8"))
              assert summary.get("format") == "tjong_tensor_shards_v1", summary
              assert summary.get("compact_storage") is True, summary
              assert (summary.get("encoding_schema") or {}).get("version") == os.environ["TENSOR_ENCODING_VERSION"], summary
              print("slide_resnet_v1_maskedhier_balanced_fresh_2x4090_preflight", json.dumps({
                  "run": os.environ["TJONG_RUN"],
                  "torch": torch.__version__,
                  "cuda": torch.cuda.is_available(),
                  "device_count": torch.cuda.device_count(),
                  "examples": int(summary.get("examples", 0)),
                  "shards": len(summary.get("shards") or []),
                  "start": "fresh",
                  "l1_lambda": float(os.environ["L1_LAMBDA"]),
                  "l2_lambda": float(os.environ["L2_LAMBDA"]),
                  "weight_decay": float(os.environ["WEIGHT_DECAY"]),
                  "lr": float(os.environ["LR"]),
                  "grad_clip": 0.5,
                  "loss_mode": "masked_hierarchical_balanced",
                  "action_loss_weight": 1.0,
                  "discard_loss_weight": 0.5,
                  "claim_loss_weight": 0.2,
                  "action_label_smoothing": 0.02,
                  "discard_label_smoothing": 0.05,
                  "claim_label_smoothing": 0.01,
                  "shuffle_within_shards": True,
                  "metric_sample_every_batches": 100,
              }, sort_keys=True), flush=True)
              PY
              python -m torch.distributed.run --standalone --nproc_per_node="${TJONG_GPU_COUNT}" \
                -m tjong_replication.train_slide_resnet_supervised \
                --train-pt "${TRAIN_PT}" \
                --checkpoint-out "${DATA_ROOT}/models/${TJONG_RUN}.pt" \
                --checkpoint-every-epoch \
                --checkpoint-archive-dir "${DATA_ROOT}/models/${TJONG_RUN}_epoch_checkpoints" \
                --metrics-out "${DATA_ROOT}/runs/${TJONG_RUN}_metrics.json" \
                --metrics-jsonl "${DATA_ROOT}/runs/${TJONG_RUN}_metrics.jsonl" \
                --feature-version v1 \
                --augmentation-mode random \
                --epochs 125 \
                --batch-size "${BATCH_SIZE}" \
                --lr "${LR}" \
                --weight-decay "${WEIGHT_DECAY}" \
                --l1-lambda "${L1_LAMBDA}" \
                --l2-lambda "${L2_LAMBDA}" \
                --base-channels 64 \
                --head-hidden 512 \
                --dropout 0.1 \
                --grad-clip 0.5 \
                --amp bf16 \
                --allow-tf32 \
                --cudnn-benchmark \
                --fuse-sub-encode \
                --channels-last \
                --ddp-static-graph \
                --metric-sample-every-batches 100 \
                --finite-check-every-batches 1000 \
                --divergence-guard-after-epochs 2 \
                --divergence-guard-max-discard-loss 0.0 \
                --divergence-guard-max-optimization-loss 100.0 \
                --divergence-guard-max-grad-norm 1000000.0 \
                --local-loss-normalization \
                --loss-mode masked_hierarchical_balanced \
                --action-loss-weight 1.0 \
                --discard-loss-weight 0.5 \
                --claim-loss-weight 0.2 \
                --action-label-smoothing 0.02 \
                --discard-label-smoothing 0.05 \
                --claim-label-smoothing 0.01 \
                --num-workers 0 \
                --device cuda \
                --distributed \
                --seed 0 \
                --require-encoding-version "${TENSOR_ENCODING_VERSION}" \
                --optimized-sharded-loader \
                --shard-prefetch 16 \
                --pin-memory \
                --log-every-batches 500 \
                ${HIDDEN_ARGS}
          resources:
            limits:
              cpu: "8"
              memory: 48Gi
              ephemeral-storage: 30Gi
              nvidia.com/gpu: 2
            requests:
              cpu: "8"
              memory: 48Gi
              ephemeral-storage: 30Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
