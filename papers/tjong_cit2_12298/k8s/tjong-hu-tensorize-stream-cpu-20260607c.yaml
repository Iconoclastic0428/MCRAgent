apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-hu-tensorize-stream-cpu-20260607c
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: hu-stream-tensorize
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: tjong-replication
        task: hu-stream-tensorize
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - k8s-haosu-22.sdsc.optiputer.net
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: hu-stream-tensorize
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              python - <<'PY'
              from pathlib import Path
              tensorizer = Path("papers/tjong_cit2_12298/src/tjong_replication/tensorize_botzone.py").read_text(encoding="utf-8")
              assert "single_action_discard_stride" in tensorizer, "missing sampled-discard tensorizer"
              assert "single_action_discard_kept" in tensorizer, "missing sampled-discard stats"
              assert "int(value) >= 8" in tensorizer, "HU legality must require at least 8 base fan"
              print("source_hu_discard_tensorizer_ready", True, flush=True)
              PY

              RAW_TAG=20260606b
              TAG=20260607c
              DISCARD_STRIDE="${TJONG_SINGLE_ACTION_DISCARD_STRIDE:-32}"
              ALL_BOTZONE=data/raw/tziakcha_all_sources_botzone_hu_${RAW_TAG}.jsonl
              VALIDATION=runs/tjong_validate_tziakcha_all_sources_botzone_hu_${RAW_TAG}.json
              HU_AUDIT=runs/tjong_hu_restore_audit_${RAW_TAG}.json
              TRAIN_PT=data/processed/tjong/tziakcha_all_sources_botzone_hu_${TAG}_tensorized.pt
              TENSORIZE_SUMMARY=runs/tjong_tensorize_all_sources_hu_${TAG}_summary.json

              test -s "${ALL_BOTZONE}"
              test -s "${VALIDATION}"
              test -s "${HU_AUDIT}"
              EXPECTED_RECORDS="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["records"])' "${VALIDATION}")"
              export VALIDATION HU_AUDIT EXPECTED_RECORDS DISCARD_STRIDE
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              audit = json.loads(Path(os.environ["HU_AUDIT"]).read_text(encoding="utf-8"))
              validation = json.loads(Path(os.environ["VALIDATION"]).read_text(encoding="utf-8"))
              assert int(audit.get("hu_response_count", 0)) > 0, audit
              assert int(audit.get("bad_hu_count", -1)) == 0, audit
              assert validation.get("valid_for_paper_supervised") is True, validation
              assert int(validation.get("records", 0)) == int(os.environ["EXPECTED_RECORDS"]), validation
              assert int(os.environ["DISCARD_STRIDE"]) > 0
              print(
                  "stream_tensorize_preflight",
                  {
                      "records": int(validation.get("records", 0)),
                      "hu_response_count": int(audit.get("hu_response_count", 0)),
                      "bad_hu_count": int(audit.get("bad_hu_count", -1)),
                      "single_action_discard_stride": int(os.environ["DISCARD_STRIDE"]),
                  },
                  flush=True,
              )
              PY

              python -m tjong_replication.tensorize_botzone \
                --in "${ALL_BOTZONE}" \
                --out "${TRAIN_PT}" \
                --summary-out "${TENSORIZE_SUMMARY}" \
                --corpus-validation "${VALIDATION}" \
                --streaming \
                --compact-metadata \
                --progress-every 50000 \
                --single-action-discard-stride "${DISCARD_STRIDE}"
              export TENSORIZE_SUMMARY
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              summary = json.loads(Path(os.environ["TENSORIZE_SUMMARY"]).read_text(encoding="utf-8"))
              stats = summary.get("stats") or {}
              action_hu = int(stats.get("action:HU", 0))
              action_discard = int(stats.get("action:DISCARD", 0))
              label_outside_hu = int(stats.get("label_outside_mask:HU", 0) or 0)
              discard_seen = int(stats.get("single_action_discard_seen", 0))
              discard_kept = int(stats.get("single_action_discard_kept", 0))
              assert summary.get("streaming") is True, summary
              assert summary.get("compact_metadata") is True, summary
              assert int(summary.get("single_action_discard_stride", 0)) == int(os.environ["DISCARD_STRIDE"]), summary
              assert action_hu > 0, summary
              assert label_outside_hu == 0, summary
              assert discard_seen > 0, summary
              assert discard_kept > 0, summary
              assert discard_seen >= discard_kept, summary
              assert action_discard > action_hu, summary
              print(
                  "tensor_hu_discard_gate",
                  {
                      "examples": int(summary.get("examples", 0)),
                      "action_DISCARD": action_discard,
                      "action_HU": action_hu,
                      "label_outside_mask_HU": label_outside_hu,
                      "single_action_discard_seen": discard_seen,
                      "single_action_discard_kept": discard_kept,
                  },
                  flush=True,
              )
              PY
          resources:
            requests:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 160Gi
            limits:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 240Gi
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
