apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-v1-hu-illegal-eval-1x4090-20260613a
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: slide-v1-hu-illegal-eval
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: tjong-replication
        task: slide-v1-hu-illegal-eval
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-4090
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: slide-v1-hu-illegal-eval
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: TJONG_BRANCH
              value: codex/tjong-paper-ppo-gate
            - name: TJONG_BATCH_SIZE
              value: "16384"
            - name: TJONG_MAX_BATCHES
              value: "256"
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              DATA_ROOT=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
              DOWNLOAD_ROOT=/tmp/mcragent_tjong_hu_illegal_eval_20260613a
              rm -rf "${DOWNLOAD_ROOT}"
              python - <<'PY'
              import os
              import shutil
              import urllib.request
              import zipfile
              from pathlib import Path

              branch = os.environ["TJONG_BRANCH"]
              url = f"https://github.com/Iconoclastic0428/MCRAgent/archive/refs/heads/{branch}.zip"
              root = Path("/tmp/mcragent_tjong_hu_illegal_eval_20260613a")
              archive = Path("/tmp/mcragent_tjong_hu_illegal_eval_20260613a.zip")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(url, archive)
              with zipfile.ZipFile(archive) as src:
                  src.extractall(root)
              children = [p for p in root.iterdir() if p.is_dir()]
              if len(children) != 1:
                  raise RuntimeError(f"unexpected archive layout: {children}")
              Path("/tmp/mcragent_tjong_hu_illegal_eval_repo_path.txt").write_text(str(children[0]), encoding="utf-8")
              print("downloaded_branch_zip", url, children[0], flush=True)
              PY
              TEST_REPO=$(cat /tmp/mcragent_tjong_hu_illegal_eval_repo_path.txt)
              cd "${TEST_REPO}"
              export PYTHONPATH="${TEST_REPO}/papers/tjong_cit2_12298/src:${TEST_REPO}/scripts:${PYTHONPATH:-}"
              CHECKPOINT="${TJONG_CHECKPOINT:-${DATA_ROOT}/models/tjong_slide_resnet_v1_maskedhier_clip01_fresh_1x4090_20260613a.pt}"
              SNAPSHOT=/tmp/tjong_slide_resnet_v1_hu_illegal_eval_checkpoint.pt
              TRAIN_PT="${TJONG_TRAIN_PT:-${DATA_ROOT}/data/processed/tjong/tziakcha_all_sources_botzone_hu_20260607f_shards/index.json}"
              METRICS_OUT="${TJONG_METRICS_OUT:-${DATA_ROOT}/runs/tjong_slide_resnet_v1_maskedhier_clip01_fresh_hu_illegal_eval_20260613a.json}"
              TENSOR_ENCODING_VERSION="${TJONG_TENSOR_ENCODING_VERSION:-tjong_cit2_12298_v3_hidden_concealed_kong}"
              export CHECKPOINT SNAPSHOT TRAIN_PT METRICS_OUT TENSOR_ENCODING_VERSION
              test -s papers/tjong_cit2_12298/src/tjong_replication/evaluate_slide_hu_illegal.py
              test -s "${TRAIN_PT}"
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              import shutil
              import subprocess
              import time
              import torch

              checkpoint = Path(os.environ["CHECKPOINT"])
              snapshot = Path(os.environ["SNAPSHOT"])
              for attempt in range(1, 121):
                  if checkpoint.is_file() and checkpoint.stat().st_size > 0:
                      size1 = checkpoint.stat().st_size
                      time.sleep(5)
                      size2 = checkpoint.stat().st_size
                      if size1 == size2:
                          shutil.copy2(checkpoint, snapshot)
                          try:
                              payload = torch.load(snapshot, map_location="cpu")
                              print("checkpoint_snapshot_ready", json.dumps({
                                  "checkpoint": str(checkpoint),
                                  "snapshot": str(snapshot),
                                  "bytes": size2,
                                  "epoch": int(payload.get("epoch", 0) or 0),
                                  "global_batch": int((payload.get("metrics") or {}).get("global_batch", 0) or 0),
                              }, sort_keys=True), flush=True)
                              break
                          except Exception as exc:
                              print("checkpoint_snapshot_load_failed", attempt, repr(exc), flush=True)
                  time.sleep(10)
              else:
                  raise RuntimeError(f"checkpoint did not become loadable: {checkpoint}")
              PY
              python -m tjong_replication.evaluate_slide_hu_illegal \
                --checkpoint "${SNAPSHOT}" \
                --eval-pt "${TRAIN_PT}" \
                --metrics-out "${METRICS_OUT}" \
                --batch-size "${TJONG_BATCH_SIZE}" \
                --max-batches "${TJONG_MAX_BATCHES}" \
                --device cuda \
                --amp bf16 \
                --allow-tf32 \
                --require-encoding-version "${TENSOR_ENCODING_VERSION}" \
                --optimized-sharded-loader \
                --shard-prefetch 8 \
                --pin-memory \
                --shuffle \
                --seed 260613
          resources:
            limits:
              cpu: "4"
              memory: 24Gi
              ephemeral-storage: 30Gi
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 24Gi
              ephemeral-storage: 30Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
