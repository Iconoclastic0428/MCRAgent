apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-supervised-rl-l40-all-sources-20260605b
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: supervised-rl-all-sources
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app: tjong-replication
        task: supervised-rl-all-sources
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: tjong-supervised-all-sources
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              python - <<'PY'
              import torch
              print("repo_commit", "tjong-supervised-rl-l40-all-sources-20260605b")
              print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count())
              PY
              test -d papers/tjong_cit2_12298/src/tjong_replication
              python -m tjong_replication.verify_paper_compliance \
                --paper-root papers/tjong_cit2_12298 \
                --summary-out runs/tjong_paper_compliance_all_sources_20260605b.json
              TRAIN_PT="${TJONG_TRAIN_PT:-data/processed/tjong/tziakcha_all_sources_botzone_20260605b_tensorized.pt}"
              EVAL_PT="${TJONG_EVAL_PT:-${TRAIN_PT}}"
              TENSORIZE_SUMMARY="${TJONG_TENSORIZE_SUMMARY:-runs/tjong_tensorize_all_sources_20260605b_summary.json}"
              VALIDATION_SUMMARY="${TJONG_VALIDATION_SUMMARY:-runs/tjong_validate_tziakcha_all_sources_botzone_20260605b.json}"
              EXPECTED_RECORDS="${TJONG_EXPECTED_RECORDS:-}"
              if [ -z "${EXPECTED_RECORDS}" ]; then
                EXPECTED_RECORDS="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["records"])' "${VALIDATION_SUMMARY}")"
              fi
              TENSOR_ENCODING_VERSION="${TJONG_TENSOR_ENCODING_VERSION:-tjong_cit2_12298_v3_hidden_concealed_kong}"
              PAPER_METRIC_TOLERANCE="${TJONG_PAPER_METRIC_TOLERANCE:-0.00005}"
              CHECKPOINT_DIR="${TJONG_SUPERVISED_CHECKPOINT_DIR:-models/tjong_supervised_all_sources_20260605b_checkpoints}"
              FINAL_CHECKPOINT="${TJONG_FINAL_CHECKPOINT:-models/tjong_supervised_all_sources_20260605b.pt}"
              METRICS_OUT="${TJONG_METRICS_OUT:-runs/tjong_supervised_all_sources_20260605b_metrics.json}"
              METRICS_JSONL="${TJONG_METRICS_JSONL:-runs/tjong_supervised_all_sources_20260605b_metrics.jsonl}"
              EVAL_OUT="${TJONG_EVAL_OUT:-runs/tjong_supervised_all_sources_20260605b_eval.json}"
              METRIC_GATE="${TJONG_METRIC_GATE:-runs/tjong_supervised_all_sources_20260605b_paper_metric_gate.json}"
              TRAIN_SEED="${TJONG_TRAIN_SEED:-0}"
              CHECKPOINT_EVERY_BATCHES="${TJONG_CHECKPOINT_EVERY_BATCHES:-0}"
              CHECKPOINT_AT_GLOBAL_BATCHES="${TJONG_CHECKPOINT_AT_GLOBAL_BATCHES:-}"
              CHECKPOINT_AT_EPOCH_BATCHES="${TJONG_CHECKPOINT_AT_EPOCH_BATCHES:-}"
              export EXPECTED_RECORDS TRAIN_PT TENSORIZE_SUMMARY VALIDATION_SUMMARY TENSOR_ENCODING_VERSION
              test -s "${TRAIN_PT}"
              test -s "${TENSORIZE_SUMMARY}"
              test -s "${VALIDATION_SUMMARY}"
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              expected = int(os.environ["EXPECTED_RECORDS"])
              summary = json.loads(Path(os.environ["TENSORIZE_SUMMARY"]).read_text())
              validation = summary.get("corpus_validation") or json.loads(Path(os.environ["VALIDATION_SUMMARY"]).read_text())
              encoding_schema = summary.get("encoding_schema") or {}
              stats = summary.get("stats") or {}
              assert summary.get("input") == "data/raw/tziakcha_all_sources_botzone_20260605b.jsonl", summary
              assert summary.get("output") == os.environ["TRAIN_PT"], summary
              assert encoding_schema.get("version") == os.environ["TENSOR_ENCODING_VERSION"], summary
              assert int(validation.get("records", -1)) == expected, summary
              assert bool(validation.get("valid_for_paper_supervised")), summary
              assert int(stats.get("matches", -1)) == expected, summary
              assert int(stats.get("record_error_lines", 0) or 0) == 0, summary
              assert int(summary.get("examples", 0) or 0) > 0, summary
              PY
              RESUME_ARGS=""
              if [ -n "${TJONG_RESUME_CHECKPOINT:-}" ]; then
                RESUME_ARGS="--resume-checkpoint ${TJONG_RESUME_CHECKPOINT}"
              elif [ -s "${CHECKPOINT_DIR}/latest.pt" ]; then
                RESUME_ARGS="--resume-checkpoint ${CHECKPOINT_DIR}/latest.pt"
              fi
              BATCH_CHECKPOINT_ARGS=""
              if [ "${CHECKPOINT_EVERY_BATCHES}" != "0" ]; then
                BATCH_CHECKPOINT_ARGS="${BATCH_CHECKPOINT_ARGS} --checkpoint-every-batches ${CHECKPOINT_EVERY_BATCHES}"
              fi
              if [ -n "${CHECKPOINT_AT_GLOBAL_BATCHES}" ]; then
                BATCH_CHECKPOINT_ARGS="${BATCH_CHECKPOINT_ARGS} --checkpoint-at-global-batches ${CHECKPOINT_AT_GLOBAL_BATCHES}"
              fi
              if [ -n "${CHECKPOINT_AT_EPOCH_BATCHES}" ]; then
                BATCH_CHECKPOINT_ARGS="${BATCH_CHECKPOINT_ARGS} --checkpoint-at-epoch-batches ${CHECKPOINT_AT_EPOCH_BATCHES}"
              fi
              python -m tjong_replication.train_supervised \
                --train-pt "${TRAIN_PT}" \
                --checkpoint-out "${FINAL_CHECKPOINT}" \
                --metrics-out "${METRICS_OUT}" \
                --metrics-jsonl "${METRICS_JSONL}" \
                --epochs 125 \
                --batch-size 1024 \
                --lr 0.0001 \
                --d-model 384 \
                --n-heads 6 \
                --ffn-dim 1536 \
                --require-encoding-version "${TENSOR_ENCODING_VERSION}" \
                --require-paper-config \
                --seed "${TRAIN_SEED}" \
                --num-workers 0 \
                --device cuda \
                --data-parallel \
                --checkpoint-every-epochs 1 \
                --checkpoint-dir "${CHECKPOINT_DIR}" \
                ${BATCH_CHECKPOINT_ARGS} \
                ${RESUME_ARGS}
              python -m tjong_replication.evaluate_supervised \
                --checkpoint "${FINAL_CHECKPOINT}" \
                --eval-pt "${EVAL_PT}" \
                --metrics-out "${EVAL_OUT}" \
                --batch-size 1024 \
                --num-workers 0 \
                --require-encoding-version "${TENSOR_ENCODING_VERSION}" \
                --require-paper-config \
                --strict-deterministic \
                --device cuda
              python -m tjong_replication.verify_paper_metrics \
                --metrics "${EVAL_OUT}" \
                --summary-out "${METRIC_GATE}" \
                --require-strict-deterministic \
                --tolerance "${PAPER_METRIC_TOLERANCE}"
          resources:
            limits:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 200Gi
              nvidia.com/gpu: 2
            requests:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 160Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
