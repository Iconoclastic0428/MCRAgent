apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-tziakcha-all-sources-prep-cpu-20260605a
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: tziakcha-all-sources-prep
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app: tjong-replication
        task: tziakcha-all-sources-prep
    spec:
      restartPolicy: Never
      containers:
        - name: tziakcha-all-sources-prep
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              RAW_LOGS="${TJONG_RAW_LOGS:-data/raw/tziakcha_all_sources_botzone_20260605a.jsonl}"
              TRAIN_PT="${TJONG_TRAIN_PT:-data/processed/tjong/tziakcha_all_sources_botzone_20260605a_tensorized.pt}"
              RAW_INITDATA="${TJONG_RAW_INITDATA:-data/processed/tjong/tziakcha_all_sources_botzone_20260605a_initdata.jsonl}"
              EXPECTED_RECORDS="${TJONG_EXPECTED_RECORDS:-763471}"
              VALIDATION_SUMMARY="${TJONG_VALIDATION_SUMMARY:-runs/tjong_validate_tziakcha_all_sources_botzone_20260605a.json}"
              TENSORIZE_SUMMARY="${TJONG_TENSORIZE_SUMMARY:-runs/tjong_tensorize_all_sources_20260605a_summary.json}"
              INITDATA_SUMMARY="${TJONG_INITDATA_SUMMARY:-runs/tjong_tziakcha_all_sources_initdata_20260605a_summary.json}"
              INITDATA_VALIDATION="${TJONG_INITDATA_VALIDATION:-runs/tjong_validate_tziakcha_all_sources_initdata_20260605a.json}"
              TENSOR_ENCODING_VERSION="${TJONG_TENSOR_ENCODING_VERSION:-tjong_cit2_12298_v3_hidden_concealed_kong}"
              export RAW_LOGS TRAIN_PT RAW_INITDATA EXPECTED_RECORDS VALIDATION_SUMMARY TENSORIZE_SUMMARY INITDATA_SUMMARY INITDATA_VALIDATION TENSOR_ENCODING_VERSION
              test -s "${RAW_LOGS}"
              python -m tjong_replication.validate_paper_corpus \
                --in "${RAW_LOGS}" \
                --expected-records "${EXPECTED_RECORDS}" \
                --summary-out "${VALIDATION_SUMMARY}"
              if [ ! -s "${TRAIN_PT}" ]; then
                python -m tjong_replication.tensorize_botzone \
                  --in "${RAW_LOGS}" \
                  --out "${TRAIN_PT}" \
                  --summary-out "${TENSORIZE_SUMMARY}" \
                  --corpus-validation "${VALIDATION_SUMMARY}"
              fi
              python - <<'PY'
              import json, os
              summary_path = os.environ["TENSORIZE_SUMMARY"]
              expected_records = int(os.environ["EXPECTED_RECORDS"])
              with open(summary_path, encoding="utf-8") as f:
                  summary = json.load(f)
              assert summary.get("input") == os.environ["RAW_LOGS"], summary
              assert summary.get("output") == os.environ["TRAIN_PT"], summary
              assert int(summary.get("stats", {}).get("matches", 0)) == expected_records, summary
              schema = summary.get("encoding_schema", {})
              assert schema.get("version") == os.environ["TENSOR_ENCODING_VERSION"], summary
              assert int(summary.get("examples", 0)) > 0, summary
              PY
              if [ ! -s "${RAW_INITDATA}" ]; then
                python -m tjong_replication.convert_tziakcha_to_initdata \
                  --in "${RAW_LOGS}" \
                  --out "${RAW_INITDATA}" \
                  --summary-out "${INITDATA_SUMMARY}" \
                  --min-written "${EXPECTED_RECORDS}" \
                  --allow-random-fallback \
                  --fail-on-error
              fi
              test -s "${RAW_INITDATA}"
              python -m tjong_replication.validate_initdata_corpus \
                --in "${RAW_INITDATA}" \
                --expected-records "${EXPECTED_RECORDS}" \
                --summary-out "${INITDATA_VALIDATION}"
          resources:
            requests:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 160Gi
            limits:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 200Gi
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
