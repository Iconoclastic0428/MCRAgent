apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-tensor-label-audit-cpu-20260605a
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: tensor-label-audit
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: tjong-replication
        task: tensor-label-audit
    spec:
      restartPolicy: Never
      containers:
        - name: tensor-label-audit
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              TRAIN_PT="${TJONG_TRAIN_PT:-data/processed/tjong/tziakcha_all_plus_live_elo2300_tensorized.pt}"
              OUT="${TJONG_TENSOR_LABEL_AUDIT_OUT:-runs/tjong_tensor_label_audit_20260605a.json}"
              python - <<'PY'
              import json
              import os
              from pathlib import Path

              import torch

              from tjong_replication.actions import ACTION_TO_INDEX, CLAIM_SIZE, DISCARD_SIZE

              path = Path(os.environ.get("TRAIN_PT", "data/processed/tjong/tziakcha_all_plus_live_elo2300_tensorized.pt"))
              out = Path(os.environ.get("OUT", "runs/tjong_tensor_label_audit_20260605a.json"))
              payload = torch.load(path, map_location="cpu")

              def tensor_stats(name: str) -> dict:
                  tensor = payload[name]
                  flat = tensor.reshape(-1)
                  stats = {
                      "dtype": str(tensor.dtype),
                      "shape": list(tensor.shape),
                      "numel": int(flat.numel()),
                  }
                  if flat.numel():
                      stats["min"] = int(flat.min().item())
                      stats["max"] = int(flat.max().item())
                      stats["unique_count"] = int(torch.unique(flat).numel())
                  return stats

              action = payload["action_label"].long()
              claim = payload["claim_label"].long()
              discard = payload["discard_label"].long()
              claim_actions = torch.tensor(
                  [
                      ACTION_TO_INDEX["CHOW"],
                      ACTION_TO_INDEX["PONG"],
                      ACTION_TO_INDEX["MINGKONG"],
                      ACTION_TO_INDEX["BUKONG"],
                      ACTION_TO_INDEX["ANKONG"],
                  ],
                  dtype=torch.long,
              )
              claim_mask = (action.unsqueeze(-1) == claim_actions).any(dim=-1)
              discard_mask = action == ACTION_TO_INDEX["DISCARD"]

              invalid = {
                  "action_label": (action < 0) | (action >= len(ACTION_TO_INDEX)),
                  "claim_label_on_claim_rows": ((claim < 0) | (claim >= CLAIM_SIZE)) & claim_mask,
                  "discard_label_on_discard_rows": ((discard < 0) | (discard >= DISCARD_SIZE)) & discard_mask,
                  "previous_actions": (payload["previous_actions"].long() < 0)
                  | (payload["previous_actions"].long() >= len(ACTION_TO_INDEX)),
                  "sub_previous_actions": (payload["sub_previous_actions"].long() < 0)
                  | (payload["sub_previous_actions"].long() >= len(ACTION_TO_INDEX)),
              }
              invalid_summary = {}
              for name, mask in invalid.items():
                  index = torch.nonzero(mask.reshape(-1), as_tuple=False).flatten()[:20]
                  invalid_summary[name] = {
                      "count": int(mask.sum().item()),
                      "first_flat_indices": [int(value.item()) for value in index],
                  }

              report = {
                  "format": "tjong_tensor_label_audit_v1",
                  "path": str(path),
                  "path_bytes": path.stat().st_size,
                  "encoding_schema": payload.get("encoding_schema") or {},
                  "examples": int(action.numel()),
                  "head_sizes": {
                      "action": len(ACTION_TO_INDEX),
                      "claim": CLAIM_SIZE,
                      "discard": DISCARD_SIZE,
                  },
                  "label_stats": {
                      "action_label": tensor_stats("action_label"),
                      "claim_label": tensor_stats("claim_label"),
                      "discard_label": tensor_stats("discard_label"),
                      "previous_actions": tensor_stats("previous_actions"),
                      "sub_previous_actions": tensor_stats("sub_previous_actions"),
                  },
                  "masked_counts": {
                      "claim_rows": int(claim_mask.sum().item()),
                      "discard_rows": int(discard_mask.sum().item()),
                  },
                  "invalid": invalid_summary,
                  "valid_for_supervised_cross_entropy": all(item["count"] == 0 for item in invalid_summary.values()),
              }
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
              print(json.dumps(report, sort_keys=True))
              PY
          resources:
            requests:
              cpu: "2"
              memory: 64Gi
              ephemeral-storage: 16Gi
            limits:
              cpu: "2"
              memory: 64Gi
              ephemeral-storage: 32Gi
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
