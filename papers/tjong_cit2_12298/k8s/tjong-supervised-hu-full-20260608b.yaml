apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-supervised-hu-full-20260608b
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: supervised-hu-full
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 604800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: tjong-replication
        task: supervised-hu-full
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                      - NVIDIA-A40
                      - NVIDIA-L40S
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-RTX-A5000
                      - NVIDIA-RTX-A6000
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                      - Quadro-RTX-6000
                      - Quadro-RTX-8000
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - hcc-chase-shor-c4705.unl.edu
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: supervised-hu-full
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              DATA_ROOT=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
              RUN=tjong_supervised_hu_full_20260608b
              COMMIT=0df3bd0cdebe76c5d4ab7f4ee4cceb5bed75186b
              DOWNLOAD_ROOT=/tmp/mcragent_tjong_full_20260608b
              rm -rf "${DOWNLOAD_ROOT}"
              python - <<'PY'
              import shutil
              import urllib.request
              import zipfile
              from pathlib import Path

              commit = "0df3bd0cdebe76c5d4ab7f4ee4cceb5bed75186b"
              url = f"https://github.com/Iconoclastic0428/MCRAgent/archive/{commit}.zip"
              root = Path("/tmp/mcragent_tjong_full_20260608b")
              archive = Path("/tmp/mcragent_tjong_full_20260608b.zip")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(url, archive)
              with zipfile.ZipFile(archive) as src:
                  src.extractall(root)
              children = [p for p in root.iterdir() if p.is_dir()]
              if len(children) != 1:
                  raise RuntimeError(f"unexpected archive layout: {children}")
              Path("/tmp/mcragent_tjong_full_repo_path.txt").write_text(str(children[0]), encoding="utf-8")
              print("downloaded_commit_zip", url, children[0], flush=True)
              PY
              TEST_REPO=$(cat /tmp/mcragent_tjong_full_repo_path.txt)
              cd "${TEST_REPO}"
              export PYTHONPATH="${TEST_REPO}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              python - <<'PY'
              from pathlib import Path
              import torch

              trainer = Path("papers/tjong_cit2_12298/src/tjong_replication/train_supervised.py").read_text(encoding="utf-8")
              print("full_run_commit", "0df3bd0cdebe76c5d4ab7f4ee4cceb5bed75186b")
              print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count())
              for idx in range(torch.cuda.device_count() if torch.cuda.is_available() else 0):
                  print("cuda_device", idx, torch.cuda.get_device_name(idx), torch.cuda.get_device_capability(idx))
              assert "validate_supervised_labels" in trainer
              assert "nonfinite_supervised_context" in trainer
              assert "batch_metrics_jsonl" in trainer
              assert "log_every_batches" in trainer
              assert "nan_to_num" not in trainer
              PY
              python -m tjong_replication.verify_paper_compliance \
                --paper-root papers/tjong_cit2_12298 \
                --summary-out "${DATA_ROOT}/runs/${RUN}_paper_compliance.json"
              python - <<'PY'
              import json
              import os
              import subprocess
              import sys
              from pathlib import Path

              data_root = Path("/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527")
              run = "tjong_supervised_hu_full_20260608b"
              log_path = data_root / "runs" / f"{run}_stdout.log"
              train_pt = data_root / "data/processed/tjong/tziakcha_all_sources_botzone_hu_20260607f_shards/index.json"
              tensorize_summary = data_root / "runs/tjong_tensorize_all_sources_hu_20260607f_summary.json"
              hu_audit = data_root / "runs/tjong_hu_restore_audit_20260606b.json"
              for path in (train_pt, tensorize_summary, hu_audit):
                  if not path.exists() or path.stat().st_size <= 0:
                      raise FileNotFoundError(path)
              tensorize = json.loads(tensorize_summary.read_text(encoding="utf-8"))
              audit = json.loads(hu_audit.read_text(encoding="utf-8"))
              stats = tensorize.get("stats") or {}
              expected_actions = {
                  "CHOW": 1829984,
                  "PONG": 1274394,
                  "MINGKONG": 58468,
                  "BUKONG": 71554,
                  "ANKONG": 44483,
                  "HU": 745368,
              }
              action_hu = int(stats.get("action:HU", 0))
              action_discard = int(stats.get("action:DISCARD", 0))
              discard_seen = int(stats.get("single_action_discard_seen", 0))
              discard_kept = int(stats.get("single_action_discard_kept", 0))
              assert tensorize.get("format") == "tjong_tensor_shards_v1", tensorize
              assert tensorize.get("sharded") is True, tensorize
              assert tensorize.get("compact_storage") is True, tensorize
              assert int(tensorize.get("single_action_discard_stride", 0)) == 1, tensorize
              assert action_hu > 0 and action_discard > action_hu, tensorize
              assert int(stats.get("label_outside_mask:HU", 0) or 0) == 0, tensorize
              assert discard_seen > 0 and discard_kept == discard_seen, tensorize
              assert int(stats.get("single_action_discard_sampled_out", 0) or 0) == 0, tensorize
              assert int(audit.get("hu_response_count", 0)) > 0 and int(audit.get("bad_hu_count", -1)) == 0, audit
              for action, expected in expected_actions.items():
                  observed = int(stats.get(f"action:{action}", 0))
                  assert observed == expected, {"action": action, "observed": observed, "expected": expected}
              print("supervised_hu_preflight", json.dumps({
                  "examples": int(tensorize.get("examples", 0)),
                  "matches": int(stats.get("matches", 0)),
                  "action_DISCARD": action_discard,
                  "action_HU": action_hu,
                  "action_CHOW": int(stats.get("action:CHOW", 0)),
                  "action_PONG": int(stats.get("action:PONG", 0)),
                  "action_MINGKONG": int(stats.get("action:MINGKONG", 0)),
                  "action_BUKONG": int(stats.get("action:BUKONG", 0)),
                  "action_ANKONG": int(stats.get("action:ANKONG", 0)),
                  "label_outside_mask_HU": int(stats.get("label_outside_mask:HU", 0) or 0),
                  "single_action_discard_seen": discard_seen,
                  "single_action_discard_kept": discard_kept,
                  "shards": len(tensorize.get("shards") or []),
              }, sort_keys=True), flush=True)

              def run_and_tee(cmd):
                  log_path.parent.mkdir(parents=True, exist_ok=True)
                  with log_path.open("a", encoding="utf-8", buffering=1) as log:
                      print("run_command", " ".join(cmd), flush=True)
                      log.write("run_command " + " ".join(cmd) + "\n")
                      proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)
                      assert proc.stdout is not None
                      for line in proc.stdout:
                          print(line, end="", flush=True)
                          log.write(line)
                      rc = proc.wait()
                      log.write(f"return_code {rc}\n")
                      if rc:
                          raise subprocess.CalledProcessError(rc, cmd)

              common = [
                  "--batch-size", "1024",
                  "--num-workers", "0",
                  "--require-encoding-version", "tjong_cit2_12298_v3_hidden_concealed_kong",
                  "--require-paper-config",
                  "--device", "cuda",
              ]
              run_and_tee([
                  sys.executable, "-m", "tjong_replication.train_supervised",
                  "--train-pt", str(train_pt),
                  "--checkpoint-out", str(data_root / "models" / f"{run}.pt"),
                  "--metrics-out", str(data_root / "runs" / f"{run}_metrics.json"),
                  "--metrics-jsonl", str(data_root / "runs" / f"{run}_metrics.jsonl"),
                  "--batch-metrics-jsonl", str(data_root / "runs" / f"{run}_batch_metrics.jsonl"),
                  "--epochs", "125",
                  "--lr", "0.0001",
                  "--d-model", "384",
                  "--n-heads", "6",
                  "--ffn-dim", "1536",
                  "--seed", "0",
                  "--data-parallel",
                  "--checkpoint-every-epochs", "1",
                  "--checkpoint-every-batches", "5000",
                  "--checkpoint-at-global-batches", "100,500,1000",
                  "--checkpoint-dir", str(data_root / "models" / f"{run}_checkpoints"),
                  "--force-math-sdp",
                  "--grad-clip", "0.5",
                  "--fail-on-nonfinite",
                  "--check-param-finiteness",
                  "--log-every-batches", "100",
                  *common,
              ])
              run_and_tee([
                  sys.executable, "-m", "tjong_replication.evaluate_supervised",
                  "--checkpoint", str(data_root / "models" / f"{run}.pt"),
                  "--eval-pt", str(train_pt),
                  "--metrics-out", str(data_root / "runs" / f"{run}_eval.json"),
                  "--strict-deterministic",
                  *common,
              ])
              PY
          resources:
            limits:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 200Gi
              nvidia.com/gpu: 2
            requests:
              cpu: "8"
              memory: 64Gi
              ephemeral-storage: 160Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
