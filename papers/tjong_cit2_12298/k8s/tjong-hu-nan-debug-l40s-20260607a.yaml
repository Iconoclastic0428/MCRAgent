apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-hu-nan-debug-l40s-20260607a
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: hu-nan-debug
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: tjong-replication
        task: hu-nan-debug
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
                      - NVIDIA-L40S
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: nan-debug
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              python - <<'PY'
              import json
              import torch
              from torch.utils.data import DataLoader
              from tjong_replication.actions import ACTION_NAMES
              from tjong_replication.model import TjongConfig, TjongNetwork
              from tjong_replication.train_supervised import (
                  configure_seed,
                  supervised_loss,
                  tensor_dataset_from_payload,
                  unpack_batch,
              )

              def nonfinite_parameters(model):
                  bad = []
                  for name, parameter in model.module.named_parameters() if isinstance(model, torch.nn.DataParallel) else model.named_parameters():
                      if not torch.isfinite(parameter).all():
                          bad.append(name)
                          if len(bad) >= 8:
                              break
                  return bad

              def run_case(name, path, max_batches=12):
                  print(json.dumps({"case": name, "stage": "load", "path": path}), flush=True)
                  payload = torch.load(path, map_location="cpu", mmap=True)
                  dataset = tensor_dataset_from_payload(payload)
                  configure_seed(0)
                  base = TjongNetwork(TjongConfig(d_model=384, n_heads=6, ffn_dim=1536, dropout=0.1))
                  device = torch.device("cuda")
                  model = torch.nn.DataParallel(base).to(device)
                  optimizer = torch.optim.Adam(model.parameters(), lr=0.0001)
                  generator = torch.Generator()
                  generator.manual_seed(1)
                  loader = DataLoader(dataset, batch_size=1024, shuffle=True, num_workers=0, generator=generator)
                  model.train()
                  for batch_index, batch in enumerate(loader, start=1):
                      inputs, labels = unpack_batch(batch, device)
                      optimizer.zero_grad(set_to_none=True)
                      outputs = model(**inputs)
                      output_finite = {
                          key: bool(torch.isfinite(value).all().item())
                          for key, value in outputs.items()
                          if torch.is_tensor(value)
                      }
                      loss = supervised_loss(outputs, labels)
                      loss_finite = bool(torch.isfinite(loss).item())
                      loss_value = float(loss.detach().item()) if loss_finite else str(loss.detach().item())
                      counts = {ACTION_NAMES[i]: int((labels[0] == i).sum().item()) for i in range(len(ACTION_NAMES))}
                      print(
                          json.dumps(
                              {
                                  "case": name,
                                  "batch": batch_index,
                                  "loss": loss_value,
                                  "loss_finite": loss_finite,
                                  "output_finite": output_finite,
                                  "action_counts": counts,
                              },
                              sort_keys=True,
                          ),
                          flush=True,
                      )
                      if not loss_finite:
                          break
                      loss.backward()
                      grad_bad = []
                      grad_max = 0.0
                      iterator = model.module.named_parameters() if isinstance(model, torch.nn.DataParallel) else model.named_parameters()
                      for param_name, parameter in iterator:
                          if parameter.grad is None:
                              continue
                          if not torch.isfinite(parameter.grad).all():
                              grad_bad.append(param_name)
                              if len(grad_bad) >= 8:
                                  break
                          grad_max = max(
                              grad_max,
                              float(torch.nan_to_num(parameter.grad.detach().float().abs(), nan=0.0, posinf=0.0).max().item()),
                          )
                      print(
                          json.dumps(
                              {
                                  "case": name,
                                  "batch": batch_index,
                                  "grad_bad": grad_bad,
                                  "grad_max": grad_max,
                              },
                              sort_keys=True,
                          ),
                          flush=True,
                      )
                      if grad_bad:
                          break
                      optimizer.step()
                      param_bad = nonfinite_parameters(model)
                      print(
                          json.dumps(
                              {
                                  "case": name,
                                  "batch": batch_index,
                                  "param_bad": param_bad,
                              },
                              sort_keys=True,
                          ),
                          flush=True,
                      )
                      if param_bad or batch_index >= max_batches:
                          break

              print(
                  json.dumps(
                      {
                          "torch": torch.__version__,
                          "cuda": torch.cuda.is_available(),
                          "device_count": torch.cuda.device_count(),
                      },
                      sort_keys=True,
                  ),
                  flush=True,
              )
              run_case("old_no_hu", "data/processed/tjong/tziakcha_all_sources_botzone_20260605b_tensorized.pt")
              run_case("hu", "data/processed/tjong/tziakcha_all_sources_botzone_hu_20260606c_tensorized.pt")
              PY
          resources:
            limits:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 160Gi
              nvidia.com/gpu: 2
            requests:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 120Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
