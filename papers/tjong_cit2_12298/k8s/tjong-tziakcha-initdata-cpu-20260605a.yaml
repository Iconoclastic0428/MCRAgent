apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-tziakcha-initdata-cpu-20260605a
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: tziakcha-initdata
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: tjong-replication
        task: tziakcha-initdata
    spec:
      restartPolicy: Never
      containers:
        - name: tjong-initdata
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              INITDATA_SOURCE="${TJONG_INITDATA_SOURCE:-data/raw/tziakcha_all_sources_botzone_20260605a.jsonl}"
              RAW_INITDATA="${TJONG_RAW_INITDATA:-data/processed/tjong/tziakcha_all_sources_botzone_20260605a_initdata.jsonl}"
              EXPECTED_RECORDS="${TJONG_RAW_INITDATA_EXPECTED_RECORDS:-763471}"
              test -s "${INITDATA_SOURCE}"
              python -m tjong_replication.convert_tziakcha_to_initdata \
                --in "${INITDATA_SOURCE}" \
                --out "${RAW_INITDATA}" \
                --summary-out runs/tjong_tziakcha_all_sources_initdata_20260605a_summary.json \
                --min-written "${EXPECTED_RECORDS}" \
                --allow-random-fallback \
                --fail-on-error
              test -s "${RAW_INITDATA}"
              python -m tjong_replication.validate_initdata_corpus \
                --in "${RAW_INITDATA}" \
                --expected-records "${EXPECTED_RECORDS}" \
                --summary-out runs/tjong_validate_tziakcha_all_sources_initdata_20260605a.json
          resources:
            limits:
              cpu: "4"
              memory: 48Gi
              ephemeral-storage: 80Gi
            requests:
              cpu: "4"
              memory: 48Gi
              ephemeral-storage: 40Gi
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
