apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-selfplay-latest-1000-20260612a
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: selfplay-latest-1000
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: tjong-replication
        task: selfplay-latest-1000
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
        - key: nautilus.io/hardware
          operator: Equal
          value: large-gpu
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: tjong-selfplay
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: IfNotPresent
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: TJONG_REF
              value: cffb5204866c8bfba06f20c3ad2641ed70191f5a
            - name: TJONG_SELFPLAY_RUN
              value: tjong_selfplay_latest_1000_20260612a
            - name: TJONG_SELFPLAY_GAMES
              value: "1000"
            - name: TJONG_SELFPLAY_OFFSET
              value: "271828"
            - name: TJONG_TENSOR_ENCODING_VERSION
              value: tjong_cit2_12298_v3_hidden_concealed_kong
            - name: OMP_NUM_THREADS
              value: "4"
            - name: MKL_NUM_THREADS
              value: "4"
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              DATA_ROOT=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
              DOWNLOAD_ROOT=/tmp/mcragent_tjong_selfplay_20260612a
              rm -rf "${DOWNLOAD_ROOT}"
              python - <<'PY'
              import os
              import shutil
              import urllib.request
              import zipfile
              from pathlib import Path

              ref = os.environ["TJONG_REF"]
              url = f"https://github.com/Iconoclastic0428/MCRAgent/archive/{ref}.zip"
              root = Path("/tmp/mcragent_tjong_selfplay_20260612a")
              archive = Path("/tmp/mcragent_tjong_selfplay_20260612a.zip")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(url, archive)
              with zipfile.ZipFile(archive) as src:
                  src.extractall(root)
              children = [p for p in root.iterdir() if p.is_dir()]
              if len(children) != 1:
                  raise RuntimeError(f"unexpected archive layout: {children}")
              Path("/tmp/mcragent_tjong_selfplay_repo_path.txt").write_text(
                  str(children[0]), encoding="utf-8"
              )
              print("downloaded_ref_zip", url, children[0], flush=True)
              PY
              TEST_REPO=$(cat /tmp/mcragent_tjong_selfplay_repo_path.txt)
              export PYTHONPATH="${TEST_REPO}/papers/tjong_cit2_12298/src:${TEST_REPO}/scripts:${DATA_ROOT}/external/Chinese-Standard-Mahjong-DRL:${PYTHONPATH:-}"
              CHECKPOINT_DIR="${DATA_ROOT}/models/tjong_supervised_hu_ddp_full_4x4090_20260608d_checkpoints"
              INITDATA="${DATA_ROOT}/data/processed/tjong/tziakcha_all_sources_botzone_20260605b_initdata.jsonl"
              JUDGE_DIR="/tmp/${TJONG_SELFPLAY_RUN}_official_judge"
              JUDGE="${JUDGE_DIR}/mcr_judge.exe"
              FAN_CHECKER="${JUDGE_DIR}/mcr_fan_check.exe"
              OUT_RAW="${DATA_ROOT}/data/processed/tjong/${TJONG_SELFPLAY_RUN}_raw.jsonl"
              OUT_FAN="${DATA_ROOT}/data/processed/tjong/${TJONG_SELFPLAY_RUN}_fan_items.jsonl"
              SUMMARY="${DATA_ROOT}/runs/${TJONG_SELFPLAY_RUN}_summary.json"
              test -s "${INITDATA}"
              apt-get update
              apt-get install -y libboost-dev libjsoncpp-dev
              python -m pip install --no-cache-dir PyMahjongGB
              python - <<'PY'
              import MahjongGB
              print("MahjongGB import ok", flush=True)
              PY
              test -s "${DATA_ROOT}/external/Chinese-Standard-Mahjong/judge/main.cpp"
              test -s "${DATA_ROOT}/external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/shanten.cpp"
              test -s "${TEST_REPO}/scripts/mcr_fan_check.cpp"
              mkdir -p "${JUDGE_DIR}/MahjongGB" "${JUDGE_DIR}/jsoncpp"
              cp "${DATA_ROOT}/external/Chinese-Standard-Mahjong/judge/main.cpp" "${JUDGE_DIR}/main.cpp"
              cp "${DATA_ROOT}"/external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/*.cpp "${JUDGE_DIR}/MahjongGB/"
              cp "${DATA_ROOT}"/external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/*.h "${JUDGE_DIR}/MahjongGB/"
              cp /usr/include/jsoncpp/json/*.h "${JUDGE_DIR}/jsoncpp/"
              g++ -O2 -std=c++14 \
                -D_BOTZONE_ONLINE \
                "${JUDGE_DIR}/main.cpp" \
                -I"${JUDGE_DIR}" \
                -I/usr/include \
                -ljsoncpp \
                -o "${JUDGE}"
              g++ -O2 -std=c++14 \
                "${TEST_REPO}/scripts/mcr_fan_check.cpp" \
                "${JUDGE_DIR}/MahjongGB/shanten.cpp" \
                -I"${JUDGE_DIR}" \
                -I/usr/include \
                -ljsoncpp \
                -o "${FAN_CHECKER}"
              test -x "${JUDGE}"
              test -x "${FAN_CHECKER}"
              SOURCE_CHECKPOINT="$(
                find "${CHECKPOINT_DIR}" -maxdepth 1 -type f \( -name 'latest.pt' -o -name 'batch_*.pt' -o -name 'epoch_*.pt' \) -mmin +2 \
                  | xargs -r ls -t \
                  | head -n 1
              )"
              if [ -z "${SOURCE_CHECKPOINT}" ]; then
                echo "No stable checkpoint older than 2 minutes found" >&2
                exit 1
              fi
              SNAPSHOT_CHECKPOINT="/tmp/${TJONG_SELFPLAY_RUN}_checkpoint.pt"
              cp "${SOURCE_CHECKPOINT}" "${SNAPSHOT_CHECKPOINT}"
              test -s "${SNAPSHOT_CHECKPOINT}"
              echo "selfplay_source_checkpoint=${SOURCE_CHECKPOINT}"
              echo "selfplay_snapshot_checkpoint=${SNAPSHOT_CHECKPOINT}"
              python - <<'PY'
              import torch
              print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count(), flush=True)
              PY
              cd "${TEST_REPO}"
              python -m tjong_replication.collect_selfplay \
                --checkpoint "${SNAPSHOT_CHECKPOINT}" \
                --raw "${INITDATA}" \
                --games "${TJONG_SELFPLAY_GAMES}" \
                --offset "${TJONG_SELFPLAY_OFFSET}" \
                --judge "${JUDGE}" \
                --fan-checker "${FAN_CHECKER}" \
                --out-raw "${OUT_RAW}" \
                --out-fan-items "${OUT_FAN}" \
                --summary-out "${SUMMARY}" \
                --require-encoding-version "${TJONG_TENSOR_ENCODING_VERSION}" \
                --require-paper-config \
                --device cuda
              test -s "${OUT_RAW}"
              test -s "${OUT_FAN}"
              test -s "${SUMMARY}"
          resources:
            limits:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 40Gi
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 20Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
