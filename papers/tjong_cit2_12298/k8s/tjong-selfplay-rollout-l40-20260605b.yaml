apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-selfplay-rollout-l40-20260605b
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: selfplay-rollout
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 259200
  template:
    metadata:
      labels:
        app: tjong-replication
        task: selfplay-rollout
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
        - key: nautilus.io/reservation
          operator: Equal
          value: csu-tide
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: tjong-selfplay
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              apt-get update
              apt-get install -y libboost-dev libjsoncpp-dev
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              python - <<'PY'
              import torch
              print("repo_commit", "tjong-selfplay-rollout-l40-20260605b")
              print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count())
              PY
              test -s external/Chinese-Standard-Mahjong/judge/main.cpp
              test -s external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/fan_calculator.cpp
              test -s external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/shanten.cpp
              test -s scripts/mcr_fan_check.cpp
              mkdir -p build/official_judge/MahjongGB
              mkdir -p build/official_judge/jsoncpp
              cp external/Chinese-Standard-Mahjong/judge/main.cpp build/official_judge/main.cpp
              cp external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/*.cpp build/official_judge/MahjongGB/
              cp external/Chinese-Standard-Mahjong/fan-calculator-usage/ChineseOfficialMahjongHelper/Classes/mahjong-algorithm/*.h build/official_judge/MahjongGB/
              cp /usr/include/jsoncpp/json/*.h build/official_judge/jsoncpp/
              g++ -O2 -std=c++14 \
                -D_BOTZONE_ONLINE \
                build/official_judge/main.cpp \
                -Ibuild/official_judge \
                -I/usr/include \
                -ljsoncpp \
                -o build/official_judge/mcr_judge.exe
              g++ -O2 -std=c++14 \
                scripts/mcr_fan_check.cpp \
                build/official_judge/MahjongGB/shanten.cpp \
                -Ibuild/official_judge \
                -I/usr/include \
                -ljsoncpp \
                -o build/official_judge/mcr_fan_check.exe
              test -x build/official_judge/mcr_judge.exe
              test -x build/official_judge/mcr_fan_check.exe
              python -m pip install --no-cache-dir PyMahjongGB
              python - <<'PY'
              import sys
              import MahjongGB
              sys.path.insert(0, "scripts")
              from official_fan import OfficialFanChecker
              from official_judge_match import load_initdata, run_match
              checker = OfficialFanChecker.default()
              assert checker is not None, "official fan checker missing"
              assert str(checker.exe_path) == "build/official_judge/mcr_fan_check.exe", checker.exe_path
              smoke = checker.evaluate(
                  packs=[],
                  hand="W1 W1 W1 W2 W2 W2 W3 W3 W3 W4 W4 W4 W5".split(),
                  win_tile="W5",
                  flower_count=0,
                  is_self_draw=False,
                  is_4th_tile=False,
                  is_about_kong=False,
                  is_last=False,
                  seat_wind=0,
                  prevalent_wind=0,
                  player=0,
              )
              assert smoke["can_hu"], smoke
              print("MahjongGB import ok")
              print("official_judge_import ok", load_initdata.__name__, run_match.__name__)
              print("fan_checker", checker.exe_path)
              print("fan_checker_smoke", smoke)
              PY
              INIT="${TJONG_POLICY_CHECKPOINT:-models/tjong_supervised_all_sources_20260605b.pt}"
              INITDATA_SOURCE="${TJONG_INITDATA_SOURCE:-data/raw/tziakcha_all_sources_botzone_20260605b.jsonl}"
              RAW_INITDATA="${TJONG_RAW_INITDATA:-data/processed/tjong/tziakcha_all_sources_botzone_20260605b_initdata.jsonl}"
              SELFPLAY_RAW="${TJONG_SELFPLAY_RAW:-data/processed/tjong/tjong_selfplay_20260605b_raw.jsonl}"
              SELFPLAY_TENSOR_PT="${TJONG_SELFPLAY_TENSOR_PT:-data/processed/tjong/tjong_selfplay_20260605b_tensorized.pt}"
              FAN_ITEMS_JSONL="${TJONG_FAN_ITEMS_JSONL:-data/processed/tjong/tjong_selfplay_20260605b_fan_items.jsonl}"
              GAMES="${TJONG_SELFPLAY_GAMES:-763475}"
              SELFPLAY_MIN_GAMES="${TJONG_SELFPLAY_MIN_GAMES:-519338}"
              MIN_TOTAL_HU_RATE="${TJONG_MIN_TOTAL_HU_RATE:-0.99}"
              MAX_HUANG_RATE="${TJONG_MAX_HUANG_RATE:-0.01}"
              OFFSET="${TJONG_SELFPLAY_OFFSET:-0}"
              JUDGE="${TJONG_JUDGE:-build/official_judge/mcr_judge.exe}"
              EXPECTED_RECORDS="${TJONG_RAW_INITDATA_EXPECTED_RECORDS:-763475}"
              TENSOR_ENCODING_VERSION="${TJONG_TENSOR_ENCODING_VERSION:-tjong_cit2_12298_v3_hidden_concealed_kong}"
              export EXPECTED_RECORDS
              export FAN_ITEMS_JSONL
              export GAMES
              export SELFPLAY_MIN_GAMES
              export MIN_TOTAL_HU_RATE
              export MAX_HUANG_RATE
              export TENSOR_ENCODING_VERSION
              test -s "${INIT}"
              test -s "${JUDGE}"
              if [ -s "${RAW_INITDATA}" ]; then
                python -m tjong_replication.validate_initdata_corpus \
                  --in "${RAW_INITDATA}" \
                  --expected-records "${EXPECTED_RECORDS}" \
                  --summary-out runs/tjong_validate_existing_selfplay_initdata_20260605b.json || rm -f "${RAW_INITDATA}"
              fi
              if [ ! -s "${RAW_INITDATA}" ]; then
                test -s "${INITDATA_SOURCE}"
                python -m tjong_replication.convert_tziakcha_to_initdata \
                  --in "${INITDATA_SOURCE}" \
                  --out "${RAW_INITDATA}" \
                  --summary-out runs/tjong_tziakcha_initdata_20260605b_summary.json \
                  --min-written "${EXPECTED_RECORDS}" \
                  --allow-random-fallback \
                  --fail-on-error
              fi
              test -s "${RAW_INITDATA}"
              python -m tjong_replication.validate_initdata_corpus \
                --in "${RAW_INITDATA}" \
                --expected-records "${EXPECTED_RECORDS}" \
                --summary-out runs/tjong_validate_selfplay_initdata_20260605b.json
              python -m tjong_replication.collect_selfplay \
                --checkpoint "${INIT}" \
                --raw "${RAW_INITDATA}" \
                --games "${GAMES}" \
                --offset "${OFFSET}" \
                --judge "${JUDGE}" \
                --out-raw "${SELFPLAY_RAW}" \
                --out-fan-items "${FAN_ITEMS_JSONL}" \
                --summary-out runs/tjong_selfplay_20260605b_summary.json \
                --require-encoding-version "${TENSOR_ENCODING_VERSION}" \
                --require-paper-config \
                --device cuda
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              summary = json.loads(Path("runs/tjong_selfplay_20260605b_summary.json").read_text())
              games = int(summary.get("games", -1))
              requested = int(os.environ["GAMES"])
              minimum = int(os.environ["SELFPLAY_MIN_GAMES"])
              min_total_hu_rate = float(os.environ["MIN_TOTAL_HU_RATE"])
              max_huang_rate = float(os.environ["MAX_HUANG_RATE"])
              assert games == requested, summary
              assert games >= minimum, summary
              assert "score_table" in summary and len(summary["score_table"]) == 4, summary
              assert "per_player" in summary and len(summary["per_player"]) == 4, summary
              assert summary.get("hu_rate") is not None and float(summary["hu_rate"]) >= min_total_hu_rate, summary
              assert summary.get("huang_rate") is not None and float(summary["huang_rate"]) <= max_huang_rate, summary
              PY
              test -s "${SELFPLAY_RAW}"
              python -m tjong_replication.tensorize_botzone \
                --in "${SELFPLAY_RAW}" \
                --out "${SELFPLAY_TENSOR_PT}" \
                --summary-out runs/tjong_selfplay_tensorize_20260605b_summary.json
              test -s "${SELFPLAY_TENSOR_PT}"
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              summary = json.loads(Path("runs/tjong_selfplay_tensorize_20260605b_summary.json").read_text())
              stats = summary.get("stats") or {}
              encoding_schema = summary.get("encoding_schema") or {}
              assert encoding_schema.get("version") == os.environ["TENSOR_ENCODING_VERSION"], summary
              assert int(stats.get("matches", -1)) > 0, summary
              assert int(stats.get("record_error_lines", 0) or 0) == 0, summary
              assert int(summary.get("examples", 0) or 0) > 0, summary
              PY
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              fan_path = Path(os.environ["FAN_ITEMS_JSONL"])
              fans = 0
              missing_tiles = 0
              if fan_path.exists():
                  for line in fan_path.read_text(encoding="utf-8").splitlines():
                      record = json.loads(line)
                      for item in record.get("fans") or []:
                          fans += 1
                          if not item.get("tiles"):
                              missing_tiles += 1
              summary = {
                  "fan_items": fans,
                  "fan_items_missing_exact_tiles": missing_tiles,
                  "exact_fan_backward_ready": fans > 0 and missing_tiles == 0,
                  "structural_display_attribution_checked_in_ppo": True,
                  "note": "Exact fan item tiles are preferred; PPO reward population can structurally attribute supported Botzone fan-display names and will fail on unsupported names.",
              }
              Path("runs/tjong_selfplay_fan_item_tile_audit_20260605b.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
              print(json.dumps(summary, sort_keys=True))
              PY
          resources:
            limits:
              cpu: "4"
              memory: 48Gi
              ephemeral-storage: 120Gi
              nvidia.com/gpu: 1
            requests:
              cpu: "4"
              memory: 48Gi
              ephemeral-storage: 80Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
