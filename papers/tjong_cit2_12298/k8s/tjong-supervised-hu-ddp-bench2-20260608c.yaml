apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-supervised-hu-ddp-bench2-20260608c
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: supervised-hu-ddp-bench
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: tjong-replication
        task: supervised-hu-ddp-bench
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                      - NVIDIA-A40
                      - NVIDIA-L40S
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-RTX-A5000
                      - NVIDIA-RTX-A6000
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                      - Quadro-RTX-6000
                      - Quadro-RTX-8000
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - hcc-chase-shor-c4705.unl.edu
                      - rci-tide-gpu-01.sdsu.edu
                      - rci-tide-gpu-02.sdsu.edu
                      - rci-tide-gpu-03.sdsu.edu
                      - rci-tide-gpu-04.sdsu.edu
                      - rci-tide-gpu-05.sdsu.edu
                      - rci-tide-gpu-06.sdsu.edu
                      - rci-tide-gpu-07.sdsu.edu
                      - rci-tide-gpu-08.sdsu.edu
                      - rci-tide-gpu-09.sdsu.edu
                      - rci-tide-gpu-10.sdsu.edu
                      - rci-tide-gpu-11.sdsu.edu
                      - rci-tide-gpu-12.sdsu.edu
                      - rci-tide-gpu-13.sdsu.edu
                      - rci-tide-gpu-14.sdsu.edu
                      - rci-tide-gpu-15.sdsu.edu
                      - rci-tide-gpu-16.sdsu.edu
                      - rci-tide-gpu-17.sdsu.edu
      containers:
        - name: supervised-hu-ddp-bench
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
            - name: NCCL_ASYNC_ERROR_HANDLING
              value: "1"
            - name: TJONG_GPU_COUNT
              value: "2"
            - name: TJONG_RUN
              value: tjong_supervised_hu_ddp_bench2_20260608c
            - name: TJONG_BRANCH
              value: codex/tjong-paper-ppo-gate
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              DATA_ROOT=/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
              DOWNLOAD_ROOT=/tmp/mcragent_tjong_ddp_bench2_20260608c
              rm -rf "${DOWNLOAD_ROOT}"
              python - <<'PY'
              import os
              import shutil
              import urllib.request
              import zipfile
              from pathlib import Path

              branch = os.environ["TJONG_BRANCH"]
              url = f"https://github.com/Iconoclastic0428/MCRAgent/archive/refs/heads/{branch}.zip"
              root = Path("/tmp/mcragent_tjong_ddp_bench2_20260608c")
              archive = Path("/tmp/mcragent_tjong_ddp_bench2_20260608c.zip")
              shutil.rmtree(root, ignore_errors=True)
              root.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(url, archive)
              with zipfile.ZipFile(archive) as src:
                  src.extractall(root)
              children = [p for p in root.iterdir() if p.is_dir()]
              if len(children) != 1:
                  raise RuntimeError(f"unexpected archive layout: {children}")
              Path("/tmp/mcragent_tjong_ddp_bench2_repo_path.txt").write_text(str(children[0]), encoding="utf-8")
              print("downloaded_branch_zip", url, children[0], flush=True)
              PY
              TEST_REPO=$(cat /tmp/mcragent_tjong_ddp_bench2_repo_path.txt)
              cd "${TEST_REPO}"
              export PYTHONPATH="${TEST_REPO}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              python - <<'PY'
              from pathlib import Path
              import json
              import os
              import torch

              data_root = Path("/data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527")
              train_pt = data_root / "data/processed/tjong/tziakcha_all_sources_botzone_hu_20260607f_shards/index.json"
              summary_path = data_root / "runs/tjong_tensorize_all_sources_hu_20260607f_summary.json"
              trainer = Path("papers/tjong_cit2_12298/src/tjong_replication/train_supervised.py").read_text(encoding="utf-8")
              assert train_pt.exists(), train_pt
              assert summary_path.exists(), summary_path
              assert "DistributedDataParallel" in trainer
              assert "iter_optimized_sharded_batches" in trainer
              assert "nan_to_num" not in trainer
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              stats = summary.get("stats") or {}
              assert summary.get("format") == "tjong_tensor_shards_v1", summary
              assert summary.get("compact_storage") is True, summary
              assert int(summary.get("single_action_discard_stride", 0)) == 1, summary
              assert int(stats.get("action:DISCARD", 0)) > int(stats.get("action:HU", 0)) > 0, summary
              assert int(stats.get("label_outside_mask:HU", 0) or 0) == 0, summary
              print("bench_preflight", json.dumps({
                  "run": os.environ["TJONG_RUN"],
                  "gpu_count": os.environ["TJONG_GPU_COUNT"],
                  "torch": torch.__version__,
                  "cuda": torch.cuda.is_available(),
                  "device_count": torch.cuda.device_count(),
                  "examples": int(summary.get("examples", 0)),
                  "shards": len(summary.get("shards") or []),
                  "action_PASS": int(stats.get("action:PASS", 0)),
                  "action_HU": int(stats.get("action:HU", 0)),
                  "action_DISCARD": int(stats.get("action:DISCARD", 0)),
                  "action_CHOW": int(stats.get("action:CHOW", 0)),
                  "action_PONG": int(stats.get("action:PONG", 0)),
                  "action_MINGKONG": int(stats.get("action:MINGKONG", 0)),
                  "action_BUKONG": int(stats.get("action:BUKONG", 0)),
                  "action_ANKONG": int(stats.get("action:ANKONG", 0)),
              }, sort_keys=True), flush=True)
              for idx in range(torch.cuda.device_count() if torch.cuda.is_available() else 0):
                  print("cuda_device", idx, torch.cuda.get_device_name(idx), torch.cuda.get_device_capability(idx), flush=True)
              PY
              python -m tjong_replication.verify_paper_compliance \
                --paper-root papers/tjong_cit2_12298 \
                --summary-out "${DATA_ROOT}/runs/${TJONG_RUN}_paper_compliance.json"
              python -m torch.distributed.run --standalone --nproc_per_node="${TJONG_GPU_COUNT}" \
                -m tjong_replication.train_supervised \
                --train-pt "${DATA_ROOT}/data/processed/tjong/tziakcha_all_sources_botzone_hu_20260607f_shards/index.json" \
                --checkpoint-out "${DATA_ROOT}/models/${TJONG_RUN}.pt" \
                --metrics-out "${DATA_ROOT}/runs/${TJONG_RUN}_metrics.json" \
                --metrics-jsonl "${DATA_ROOT}/runs/${TJONG_RUN}_metrics.jsonl" \
                --batch-metrics-jsonl "${DATA_ROOT}/runs/${TJONG_RUN}_batch_metrics.jsonl" \
                --epochs 125 \
                --batch-size 1024 \
                --lr 0.0001 \
                --d-model 384 \
                --n-heads 6 \
                --ffn-dim 1536 \
                --require-encoding-version tjong_cit2_12298_v3_hidden_concealed_kong \
                --require-paper-config \
                --seed 0 \
                --num-workers 0 \
                --device cuda \
                --distributed \
                --optimized-sharded-loader \
                --shard-prefetch 2 \
                --pin-memory \
                --checkpoint-every-epochs 0 \
                --checkpoint-every-batches 0 \
                --checkpoint-dir "${DATA_ROOT}/models/${TJONG_RUN}_checkpoints" \
                --grad-clip 0.5 \
                --fail-on-nonfinite \
                --check-param-finiteness \
                --preflight-supervised-contract \
                --log-every-batches 100 \
                --max-steps 3000
          resources:
            limits:
              cpu: "16"
              memory: 128Gi
              ephemeral-storage: 200Gi
              nvidia.com/gpu: 2
            requests:
              cpu: "16"
              memory: 128Gi
              ephemeral-storage: 160Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
