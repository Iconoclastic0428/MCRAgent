apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-supervised-original-fresh-l40-20260605a
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: supervised-original-fresh
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 604800
  template:
    metadata:
      labels:
        app: tjong-replication
        task: supervised-original-fresh
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: tjong-supervised
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PIP_ROOT_USER_ACTION
              value: ignore
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              python - <<'PY'
              import torch
              print("repo_commit", "tjong-supervised-original-fresh-l40-20260605a")
              print("torch", torch.__version__, "cuda", torch.cuda.is_available(), "device_count", torch.cuda.device_count())
              PY
              test -d papers/tjong_cit2_12298/src/tjong_replication
              python -m tjong_replication.verify_paper_compliance \
                --paper-root papers/tjong_cit2_12298 \
                --summary-out runs/tjong_paper_compliance_original_fresh_20260605a.json
              TZIAKCHA_RAW="${TJONG_TZIAKCHA_RAW:-data/raw/tziakcha_all_plus_live_elo2300_session_audit_raw.jsonl}"
              RAW_LOGS="${TJONG_RAW_LOGS:-data/raw/tziakcha_all_plus_live_elo2300_botzone.jsonl}"
              TRAIN_PT="${TJONG_TRAIN_PT:-data/processed/tjong/tziakcha_all_plus_live_elo2300_tensorized.pt}"
              EVAL_PT="${TJONG_EVAL_PT:-${TRAIN_PT}}"
              EXPECTED_RECORDS="${TJONG_EXPECTED_RECORDS:-763358}"
              TENSOR_ENCODING_VERSION="${TJONG_TENSOR_ENCODING_VERSION:-tjong_cit2_12298_v3_hidden_concealed_kong}"
              RAW_SHA256="${TJONG_RAW_SHA256:-}"
              TZIAKCHA_CONVERT_SUMMARY="runs/tjong_tziakcha_to_botzone_20260605a_summary.json"
              TENSORIZE_SUMMARY="runs/tjong_tensorize_20260605a_summary.json"
              VALIDATION_SUMMARY="runs/tjong_validate_supervised_corpus_original_fresh_20260605a.json"
              FINAL_CHECKPOINT="${TJONG_FINAL_CHECKPOINT:-models/tjong_supervised_original_fresh_20260605a.pt}"
              METRICS_OUT="${TJONG_METRICS_OUT:-runs/tjong_supervised_original_fresh_20260605a_metrics.json}"
              EVAL_OUT="${TJONG_EVAL_OUT:-runs/tjong_supervised_original_fresh_20260605a_eval.json}"
              METRIC_GATE="${TJONG_METRIC_GATE:-runs/tjong_supervised_original_fresh_20260605a_paper_metric_gate.json}"
              PAPER_METRIC_TOLERANCE="${TJONG_PAPER_METRIC_TOLERANCE:-0.00005}"
              export EXPECTED_RECORDS RAW_LOGS TRAIN_PT TENSORIZE_SUMMARY VALIDATION_SUMMARY TENSOR_ENCODING_VERSION
              if [ ! -f "${RAW_LOGS}" ]; then
                test -s "${TZIAKCHA_RAW}"
                python -m tjong_replication.convert_tziakcha_to_botzone \
                  --in "${TZIAKCHA_RAW}" \
                  --out "${RAW_LOGS}" \
                  --summary-out "${TZIAKCHA_CONVERT_SUMMARY}" \
                  --min-written 763358 \
                  --fail-on-error
              fi
              test -s "${RAW_LOGS}"
              if [ -n "${RAW_SHA256}" ]; then
                python -m tjong_replication.validate_paper_corpus \
                  --in "${RAW_LOGS}" \
                  --expected-records "${EXPECTED_RECORDS}" \
                  --sha256 "${RAW_SHA256}" \
                  --summary-out "${VALIDATION_SUMMARY}"
              else
                python -m tjong_replication.validate_paper_corpus \
                  --in "${RAW_LOGS}" \
                  --expected-records "${EXPECTED_RECORDS}" \
                  --summary-out "${VALIDATION_SUMMARY}"
              fi
              if [ ! -f "${TRAIN_PT}" ]; then
                python -m tjong_replication.tensorize_botzone \
                  --in "${RAW_LOGS}" \
                  --out "${TRAIN_PT}" \
                  --summary-out "${TENSORIZE_SUMMARY}" \
                  --corpus-validation "${VALIDATION_SUMMARY}"
              fi
              test -s "${TENSORIZE_SUMMARY}"
              python - <<'PY'
              import json
              import os
              from pathlib import Path
              expected = int(os.environ["EXPECTED_RECORDS"])
              summary = json.loads(Path(os.environ["TENSORIZE_SUMMARY"]).read_text())
              validation = summary.get("corpus_validation") or {}
              encoding_schema = summary.get("encoding_schema") or {}
              stats = summary.get("stats") or {}
              assert summary.get("input") == os.environ["RAW_LOGS"], summary
              assert summary.get("output") == os.environ["TRAIN_PT"], summary
              assert encoding_schema.get("version") == os.environ["TENSOR_ENCODING_VERSION"], summary
              assert int(validation.get("records", -1)) == expected, summary
              assert bool(validation.get("valid_for_paper_supervised")), summary
              assert int(stats.get("matches", -1)) == expected, summary
              assert int(stats.get("record_error_lines", 0) or 0) == 0, summary
              assert int(summary.get("examples", 0) or 0) > 0, summary
              PY
              python -m tjong_replication.train_supervised \
                --train-pt "${TRAIN_PT}" \
                --checkpoint-out "${FINAL_CHECKPOINT}" \
                --metrics-out "${METRICS_OUT}" \
                --epochs 125 \
                --batch-size 1024 \
                --lr 0.0001 \
                --d-model 384 \
                --n-heads 6 \
                --ffn-dim 1536 \
                --require-encoding-version "${TENSOR_ENCODING_VERSION}" \
                --num-workers 0 \
                --device cuda \
                --data-parallel
              python -m tjong_replication.evaluate_supervised \
                --checkpoint "${FINAL_CHECKPOINT}" \
                --eval-pt "${EVAL_PT}" \
                --metrics-out "${EVAL_OUT}" \
                --batch-size 1024 \
                --num-workers 0 \
                --require-encoding-version "${TENSOR_ENCODING_VERSION}" \
                --require-paper-config \
                --device cuda
              python -m tjong_replication.verify_paper_metrics \
                --metrics "${EVAL_OUT}" \
                --summary-out "${METRIC_GATE}" \
                --tolerance "${PAPER_METRIC_TOLERANCE}"
          resources:
            limits:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 200Gi
              nvidia.com/gpu: 2
            requests:
              cpu: "8"
              memory: 96Gi
              ephemeral-storage: 160Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
