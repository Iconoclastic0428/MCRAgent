apiVersion: batch/v1
kind: Job
metadata:
  name: tjong-tziakcha-convert-cpu-20260605a
  namespace: nourish-sdsc
  labels:
    app: tjong-replication
    task: tziakcha-convert
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app: tjong-replication
        task: tziakcha-convert
    spec:
      restartPolicy: Never
      containers:
        - name: tziakcha-convert
          image: docker.io/zpliang/documentsegementation:latest
          imagePullPolicy: Always
          workingDir: /data/idl/mcr_agent_transformer_20260527_0029/mcr_transformer_sync_20260527
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          command: ["sh", "-lc"]
          args:
            - |
              set -eux
              export PYTHONPATH="${PWD}/papers/tjong_cit2_12298/src:${PYTHONPATH:-}"
              TZIAKCHA_RAW="${TJONG_TZIAKCHA_RAW:-data/raw/tziakcha_all_plus_live_elo2300_session_audit_raw.jsonl}"
              RAW_LOGS="${TJONG_RAW_LOGS:-data/raw/tziakcha_all_plus_live_elo2300_botzone.jsonl}"
              EXPECTED_RECORDS="${TJONG_EXPECTED_RECORDS:-763358}"
              test -s "${TZIAKCHA_RAW}"
              if [ ! -f "${RAW_LOGS}" ]; then
                python -m tjong_replication.convert_tziakcha_to_botzone \
                  --in "${TZIAKCHA_RAW}" \
                  --out "${RAW_LOGS}" \
                  --summary-out runs/tjong_tziakcha_to_botzone_20260605a_summary.json \
                  --min-written "${EXPECTED_RECORDS}" \
                  --fail-on-error
              fi
              test -s "${RAW_LOGS}"
              python -m tjong_replication.validate_paper_corpus \
                --in "${RAW_LOGS}" \
                --expected-records "${EXPECTED_RECORDS}" \
                --summary-out runs/tjong_validate_tziakcha_botzone_20260605a.json
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 20Gi
            limits:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 80Gi
          volumeMounts:
            - name: idl-data
              mountPath: /data/idl
      volumes:
        - name: idl-data
          persistentVolumeClaim:
            claimName: llama-model-pvc
